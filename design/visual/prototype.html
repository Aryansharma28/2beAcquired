<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>poof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#D7F57A; --ink:#0F2A18; --moss:#4A5F50; --limetint:#EEFBC8;
  --page:#F4F6F4; --surface:#FFFFFF; --line:#E1E8E3; --alert:#D93A3F;
  --shadow-soft:0 1px 3px rgba(15,42,24,.08);
  --shadow-float:0 10px 30px rgba(15,42,24,.18);
  --out:cubic-bezier(.22,1,.36,1);
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 'Figtree',system-ui,sans-serif;color:var(--ink);background:var(--page);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
p{margin:0}
img{display:block;max-width:100%}

/* hand marker + puff divider */
.pb{background:var(--lime);padding:0 12px;border-radius:14px 5px 16px 7px / 9px 15px 7px 13px;display:inline-block;transform:rotate(-1.5deg)}
.pline{height:14px;background:radial-gradient(circle at 50% 0,var(--line) 62%,transparent 66%) top left/20px 14px round no-repeat}

/* type */
.q{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--moss);margin-bottom:20px}
.eyebrow{font-size:13px;color:var(--moss);font-weight:600}
.sec{font-size:12px;font-weight:700;color:var(--moss);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec a,.sec button{font-size:13px;color:var(--ink);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-weight:700}
.muted{color:var(--moss)}
.small{font-size:14px}
.xs{font-size:13px}
.num-big{font-variant-numeric:tabular-nums}

/* icon buttons / icons */
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-soft);cursor:pointer;padding:0;color:var(--ink)}
.icon-btn.plain{box-shadow:none;background:transparent}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.cloudmark{fill:currentColor;stroke:none;width:11px;height:9px}
.icon.cta-ic{width:18px;height:18px;stroke-width:2.6;transition:transform .35s var(--spring)}
.bar-title{font-weight:700;font-size:17px;margin:0}

/* photos: real cutouts / photos */
.ph{display:block;position:relative;background:var(--limetint);border-radius:12px;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.cutout{background:var(--page);overflow:visible}
.ph.cutout img{object-fit:contain}
.ph-note{position:absolute;z-index:1;right:8px;bottom:8px;background:var(--surface);border-radius:999px;font-size:12px;padding:2px 8px;font-weight:600;box-shadow:var(--shadow-soft)}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--limetint);border:0;display:grid;place-items:center;font-weight:800;position:relative;font-size:15px;color:var(--ink)}
.avatar .pl{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:6px;background:var(--surface);box-shadow:var(--shadow-soft);display:grid;place-items:center;overflow:hidden}
.avatar .pl img,.avatar .pl svg{width:100%;height:100%}

/* sticker photos: landing sticker filter + slight tilt, shadow kept subtle and never clipped */
.sticker{transform:rotate(var(--tilt,-2deg))}
.sticker img{filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(15,42,24,.12))}
.stickerwrap{position:relative;overflow:visible}

/* real price tags: paper tag, notch, punched hole, string loop */
.pricetag{position:absolute;top:-6px;right:-6px;z-index:2;padding:5px 10px 5px 19px;color:var(--ink);
  font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;
  transform:rotate(var(--tilt,8deg));filter:drop-shadow(0 2px 3px rgba(15,42,24,.2))}
.pricetag::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:3px;
  background:radial-gradient(circle at 9px 50%,var(--surface) 0 2.4px,var(--ink) 2.5px 3.6px,transparent 3.7px),var(--lime);
  clip-path:polygon(0 50%,10px 0,100% 0,100% 100%,10px 100%)}
.pricetag::after{content:"";position:absolute;left:-13px;top:-7px;width:22px;height:16px;border:1.5px solid var(--ink);
  border-color:var(--ink) transparent transparent var(--ink);border-radius:50%;transform:rotate(-20deg)}
.pricetag.sold{background:none}
.pricetag.sold::before{background:radial-gradient(circle at 9px 50%,var(--surface) 0 2.4px,var(--ink) 2.5px 3.6px,transparent 3.7px),var(--ink)}
.pricetag.sold{color:var(--lime)}

/* buttons */
.btn{min-height:52px;width:100%;border-radius:999px;border:0;background:var(--ink);color:var(--lime);font-weight:700;font-size:16px;cursor:pointer;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .35s var(--spring)}
.btn:hover{transform:translateY(-1px)}
.btn:hover .cta-ic{transform:translateX(4px)}
.btn.secondary{background:var(--surface);color:var(--ink);min-height:44px;box-shadow:var(--shadow-soft);font-size:15px;width:auto}
.btn.ghost{background:none;color:var(--ink);text-decoration:underline;min-height:44px;font-weight:600}
.btn.small{width:auto;min-height:34px;padding:0 14px;font-size:13px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:700}
.btn:disabled{background:var(--line);color:var(--moss);cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.card{border-radius:20px;background:var(--surface)}
.pad{padding:16px}
.divided > *{border-top:1px solid var(--line)}
.divided > *:first-child{border-top:0}
.tag{display:inline-flex;align-items:center;font-size:12px;line-height:1.5;border-radius:4px;padding:1px 6px;font-weight:700;background:var(--limetint);color:var(--ink);white-space:nowrap}
.agenttag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--lime);font-size:11px;font-weight:800;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap;background:var(--surface);box-shadow:var(--shadow-soft)}
.chip.solid{background:var(--ink);color:#fff;box-shadow:none}
.un{min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink);flex:none}
.agent{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;font-size:14px;background:var(--limetint)}
.chevron{color:var(--moss)}
.cloudtag{display:inline-flex;width:15px;height:15px;flex:none;border-radius:4px;background:var(--ink);color:var(--lime);align-items:center;justify-content:center}

/* wizard header */
.wizbar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.wizbar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.step-count{font-size:13px;color:var(--moss);font-variant-numeric:tabular-nums;white-space:nowrap}
.context{display:flex;align-items:center;gap:8px;border-radius:14px;padding:6px 10px;margin:4px 0 16px;background:var(--surface);box-shadow:var(--shadow-soft);overflow:visible}
.context .ph{width:28px;height:28px}
.context .info{display:flex;align-items:baseline;gap:6px;font-size:13px;min-width:0;overflow:hidden}
.context b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context span{color:var(--moss);white-space:nowrap}

/* radio chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{position:relative}
.rchip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.rchip span{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-soft);font-weight:600}
.rchip input:checked + span{background:var(--ink);color:#fff;box-shadow:none}
.rchip input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}

/* navbar */
#tabbar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);height:64px;padding:0 8px;border-radius:32px;background:var(--ink);display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-float);z-index:30}
#tabbar .tab{flex:none;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative}
#tabbar .tab[aria-current="page"]{width:auto;flex:1;padding:0 18px 0 14px;background:var(--lime);color:var(--ink);gap:8px;font-size:14px;font-weight:700}
#tabbar .ico{position:relative;display:inline-flex}
.tbadge{position:absolute;top:-7px;right:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--surface);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 3px}
#tabbar .tab[aria-current="page"] .tbadge{background:var(--ink);color:var(--lime)}
#tabbar .sell{width:48px;height:48px;border-radius:24px;border:0;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.body2.has-nav{padding-bottom:112px}

/* camera */
.top2.cam{justify-content:space-between}
.viewfinder{position:relative;flex:1;margin:0 16px;border-radius:20px;overflow:hidden;background:var(--ink)}
.viewfinder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.vf-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,42,24,.55),transparent 42%)}
.corner{position:absolute;width:34px;height:34px;border:3px solid var(--lime);z-index:1}
.corner.tl{top:56px;left:22px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.corner.tr{top:56px;right:22px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.corner.bl{bottom:84px;left:22px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.corner.br{bottom:84px;right:22px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.pill{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.viewfinder .agent{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;background:var(--surface)}
.slots{display:flex;gap:8px;padding:14px 20px 4px}
.slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer}
.slot .box{width:100%;aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--moss);position:relative;background:var(--surface)}
.slot.filled .box{border:0;background:var(--limetint);overflow:hidden}
.slot.filled .box img{width:100%;height:100%;object-fit:cover}
.slot.next .box{border-color:var(--ink);border-style:solid}
.slot span{font-size:12px;color:var(--moss);font-weight:600}
.slot .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:1}
.slot .x .icon{width:12px;height:12px;stroke-width:2.6}
.cam-count{text-align:center;font-size:13px;color:var(--moss);margin:6px 0 0;font-weight:600}
.cam-controls{display:flex;align-items:center;justify-content:space-between;padding:10px 24px 24px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);background:#fff;cursor:pointer;position:relative;padding:0}
.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--lime)}
.shutter:disabled{opacity:.4;cursor:not-allowed}

.cover{position:relative;display:block;width:100%;height:230px;border:0;padding:0;background:none;cursor:pointer}
.cover .ph{width:100%;height:100%;border-radius:20px}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs button{flex:1;height:58px;padding:0;border:0;background:none;cursor:pointer}
.thumbs .ph{width:100%;height:100%;border-radius:10px}
.thumbs button[aria-pressed="true"] .ph{box-shadow:0 0 0 2px var(--ink)}
.recog{margin-top:18px}
.recog h2{font-size:24px;margin:2px 0 2px;font-weight:800;letter-spacing:-.02em}
.helper{font-size:13px;color:var(--moss);margin-top:8px}
.dl{margin:0}
.dl div{display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;min-height:52px}
.dl dt{color:var(--moss);width:84px;flex:none;font-size:14px}
.dl dd{margin:0;flex:1;font-weight:700}

.tabs{display:flex;padding:4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-soft)}
.tabs button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:600;color:var(--moss);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--lime);color:var(--ink)}
.tradeoff{font-size:18px;font-weight:700;margin:18px 0 8px}

.stepper{display:flex;align-items:center;justify-content:space-between;padding:14px 14px;box-shadow:var(--shadow-soft)}
.stepper .icon-btn{width:52px;height:52px;border-radius:50%}
.price-big{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.histo{position:relative;height:120px;display:flex;align-items:flex-end;gap:4px;padding:0 2px;margin-top:46px}
.histo i{flex:1;background:var(--limetint);border-radius:4px 4px 0 0}
.histo i.below{background:var(--line)}
.histo .marker{position:absolute;top:-22px;bottom:-6px;width:2px;background:var(--ink);transform:translateX(-1px);z-index:1}
.histo .marker span{position:absolute;top:-2px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px}
.histo .marker.goal{top:-46px;background:var(--lime)}
.histo .marker.goal span{background:var(--lime);color:var(--ink)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--moss);margin-top:6px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:8px}
.promise{display:flex;gap:12px;align-items:flex-start;background:var(--limetint);border-radius:16px;padding:14px 16px;margin-top:18px}
.promise b{display:block;font-weight:700}
.goalrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.goalrow .stepper{flex:none;padding:8px 10px;gap:10px}
.goalrow .stepper .icon-btn{width:36px;height:36px}
.goalrow .price-big{font-size:22px}
.goalrow b.lbl{font-size:14px;font-weight:700}

.option{border-radius:20px;margin-bottom:10px;background:var(--surface);box-shadow:var(--shadow-soft)}
.option > label{display:flex;align-items:flex-start;gap:12px;padding:16px;cursor:pointer}
.option > label input{width:22px;height:22px;accent-color:#0F2A18;margin:2px 0 0;flex:none}
.option > label .grow{flex:1}
.option > label b{display:flex;align-items:center;gap:8px;font-weight:700}
.option.checked{box-shadow:0 0 0 2px var(--ink)}
.option .more{padding:0 16px 16px 50px;display:none;flex-direction:column;gap:12px}
.option.checked .more{display:flex}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--moss);font-weight:600}
.field input[type=text]{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
fieldset{border:0;margin:0;padding:0}
legend{padding:0;font-size:13px;color:var(--moss);margin-bottom:6px;font-weight:600}
.more .rchip span{min-height:40px;padding:0 14px}
.pickup-sum{justify-content:space-between}
.pickup-sum span{font-weight:600}

.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;padding:14px 16px}
.st-ico{width:26px;height:26px;flex:none;border-radius:50%;background:var(--line);display:grid;place-items:center;margin-top:1px;color:transparent}
.st-ico .icon{width:14px;height:14px;stroke-width:2.6;display:none}
.step[data-state="done"] .st-ico{background:var(--ink);color:#fff}
.step[data-state="done"] .st-ico .icon{display:block}
.step[data-state="running"] .st-ico{background:var(--lime);color:var(--ink)}
.step[data-state="running"]{background:var(--limetint);border-radius:16px}
.step[data-state="next"]{color:var(--moss)}
.step .grow{flex:1;min-width:0}
.step b{display:block;font-weight:700}

.gallery{position:relative}
.gallery .ph.main{width:100%;height:230px;border-radius:20px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.ad-title{font-size:20px;font-weight:800;line-height:1.25;margin-top:14px}
.price-row{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.price-row .p{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid2 div{padding:12px 16px}
.grid2 div:nth-child(even){border-left:1px solid var(--line)}
.grid2 span{display:block;font-size:12px;color:var(--moss)}
.grid2 b{font-size:14px;font-weight:700}
.plat-toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ptog{position:relative}
.ptog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ptog span{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-soft)}
.ptog span .icon{margin-left:auto;visibility:hidden}
.ptog input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.ptog input:checked + span .icon{visibility:visible}
[contenteditable="true"]{outline:2px dashed var(--line);outline-offset:4px;border-radius:6px}

.plat-list{list-style:none;margin:0;padding:0}
.plat-list li{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.plat-list .grow b{display:block;font-weight:700}
.plat-list .grow span{font-size:13px;color:var(--moss)}
.bar-prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--lime);transition:width .5s var(--out)}
.hero{position:relative;height:230px;flex:none}
.hero .ph{width:100%;height:100%;border-radius:0}
.hero .icon-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);z-index:2}
.hero .icon-btn.l{left:16px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg4 i{height:4px;border-radius:2px;background:var(--line)}
.seg4 i.on{background:var(--ink)}
.seg4 span{font-size:12px;color:var(--moss);margin-top:6px}
.seg4 span.cur{color:var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:16px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow-soft)}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:800}
.tile span{font-size:13px;color:var(--moss)}
.now-row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:0 2px;cursor:pointer;text-align:left;margin-top:16px}
.now-row .grow{flex:1;font-weight:600}
.chip-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip-btn{min-height:44px;border-radius:999px;padding:0 16px;background:var(--surface);box-shadow:var(--shadow-soft);cursor:pointer;font-weight:600;border:0}
.actionbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--surface)}
.actionbar .btn{width:auto;padding:0 24px}
.actionbar b{font-size:22px;font-variant-numeric:tabular-nums;font-weight:800}

.group{margin-bottom:24px}
.group-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0 0 10px;text-align:left;cursor:pointer;overflow:visible}
.group-head .ph{width:44px;height:44px}
.group-head .grow{flex:1;min-width:0}
.group-head b{font-weight:700}
.group-head .grow span{display:block;font-size:13px;color:var(--moss)}
.subhead{font-size:12px;color:var(--moss);font-weight:700;margin:2px 0 8px}
.chat-row{display:flex;gap:12px;align-items:center;width:100%;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-soft);padding:12px 14px;text-align:left;cursor:pointer;min-height:74px;margin-bottom:8px;border:0}
.chat-row .grow{flex:1;min-width:0}
.chat-row .top-line{display:flex;align-items:center;gap:6px}
.chat-row .top-line b{font-weight:700}
.chat-row .top-line b.normal{font-weight:600}
.chat-row .last{display:block;font-size:14px;color:var(--moss);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-row.needs .last{color:var(--ink);font-weight:600}
.chat-row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.offer-pill{font-weight:800;border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums;background:var(--limetint)}
.typing{display:inline-flex;gap:3px;align-items:center;margin-right:4px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--moss);animation:tdot 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
details.fold{border-radius:20px;margin-top:8px}
details.fold summary{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;cursor:pointer;font-weight:600;color:var(--moss);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold .inner{padding:4px 0 2px}
details.fold .chat-row{cursor:default;background:var(--page);box-shadow:none}

.item-row{flex:none;display:flex;gap:12px;align-items:center;padding:10px 20px 16px;overflow:visible}
.item-row .ph{width:44px;height:44px}
.item-row .grow{flex:1;min-width:0}
.item-row .btn{flex:none}
.item-row b{font-weight:700}
.item-row .grow span{display:block;font-size:13px;color:var(--moss)}
.thread{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.day{align-self:center;font-size:12px;color:var(--moss);margin:6px 0;font-weight:600}
.msg{max-width:80%;padding:12px 14px;border-radius:18px;font-size:15px}
.msg .who{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--moss);margin-bottom:4px}
.msg.buyer{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow-soft);border-bottom-left-radius:6px}
.msg.agent-m{align-self:flex-end;background:var(--lime);color:var(--ink);border-bottom-right-radius:6px}
.msg.you{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.you .who{color:rgba(255,255,255,.65)}
.offer-card{border-radius:14px;padding:8px 12px;margin:4px 0 8px;background:rgba(255,255,255,.55);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.msg.buyer .offer-card{background:var(--page)}
.offer-card small{font-size:11px;font-weight:700;color:var(--moss)}
.offer-card b{font-size:22px;font-variant-numeric:tabular-nums}
.offer-card.accepted{background:var(--ink);color:#fff}
.offer-card.accepted small{color:rgba(255,255,255,.65)}
.deal{border-radius:20px;padding:14px;margin-top:8px;display:flex;gap:12px;align-items:center;background:var(--limetint)}
.deal b{display:block;font-weight:700}
.cal{width:52px;flex:none;border-radius:12px;text-align:center;padding:6px 0;line-height:1.1;background:var(--surface);box-shadow:var(--shadow-soft)}
.cal b{display:block;font-size:20px;font-weight:800}
.cal small{font-size:10px;font-weight:700;color:var(--moss)}
.composer{flex:none;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.composer .row input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:22px;padding:0 16px;background:var(--surface)}
.qr{display:flex;gap:8px;padding:0 20px 10px;flex-wrap:wrap;background:var(--surface)}
.qrbtn{min-height:40px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;border:0}
.qrbtn.primary{background:var(--ink);color:var(--lime)}
.qrbtn.secondary{background:var(--surface);box-shadow:var(--shadow-soft);color:var(--ink)}

.soldphone{background:var(--ink);color:#fff}
.soldstage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:var(--limetint);overflow:visible;color:var(--ink)}
.soldstage .sticker{width:56%;max-width:210px}
.sold-text{position:absolute;left:0;right:0;top:14%;text-align:center;padding:0 24px;opacity:0;transition:opacity .5s var(--out)}
.sold-text.show{opacity:1}
.sold-text .big{font-size:30px;font-weight:800;line-height:1.15}
.next-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .6s var(--spring);box-shadow:var(--shadow-float);max-height:70%;overflow-y:auto}
.next-panel.show{transform:translateY(0)}
.recap div{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 2px}
.recap div b{font-variant-numeric:tabular-nums;font-weight:700}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rchips > span{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;background:var(--page);font-weight:600}
.rchips .icon{width:14px;height:14px;stroke-width:2.6}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;padding:8px 0;position:relative}
.timeline li::before{content:"";width:18px;height:18px;flex:none;border-radius:50%;background:var(--line);margin-top:2px}
.timeline li.done::before{background:var(--ink)}
.timeline li b{display:block;font-weight:700}
.timeline li span{font-size:14px;color:var(--moss)}
.poof-fx{position:absolute;z-index:9;pointer-events:none;background:url(assets/poof-sprite.webp) 0 0/2600% 100% no-repeat;animation:sprite .867s steps(25) forwards;transition:transform .35s var(--out),opacity .35s var(--out)}
.poof-fx.out{transform:scale(.4) translateY(-20px);opacity:0}
@keyframes sprite{to{background-position:100% 0}}

.home-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.home-head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.grid-ads{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:32px 16px}
.gtile{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.gtile .ph{width:100%;aspect-ratio:1;border-radius:0;background:none;overflow:visible}
.gtile .ph img{object-fit:contain}
.gtile span.t{display:block;margin-top:10px;font-weight:700;line-height:1.3;font-size:14px}

/* ---------- app shell ---------- */
#app-shell{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--page)}
#phone-wrap{position:relative;width:100%;height:100dvh}
#phone{position:relative;width:100%;height:100%;background:var(--page);overflow:hidden;display:block}
#restart{display:none;margin-top:14px;background:none;border:0;color:var(--moss);font:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;padding:6px}
@media (min-width:560px){
  #app-shell{padding:40px 16px}
  #phone-wrap{width:390px;height:844px;flex:none}
  #phone{border-radius:44px;border:1px solid var(--line);box-shadow:var(--shadow-float)}
  #restart{display:inline-flex}
}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page)}
.top2{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 8px;min-height:64px}
.body2{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 24px}
.foot2{flex:none;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.hint2{font-size:13px;color:var(--moss);text-align:center}

#banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;background:var(--ink);color:#fff;border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:none;transform:translateY(-160%);transition:transform .35s var(--out),box-shadow .35s;cursor:pointer}
#banner.show{transform:translateY(0);box-shadow:var(--shadow-float)}
#banner .btxt b{display:block;font-weight:700;font-size:14px;line-height:1.3}
#banner .btxt small{color:rgba(255,255,255,.65);font-size:11px}
</style>
</head>
<body>

<script>
(() => {
  'use strict';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const phoneEl = document.getElementById('phone');
  const stageEl = document.getElementById('stage');
  const bannerEl = document.getElementById('banner');
  const tabbarEl = document.getElementById('tabbar');
  const chatBadgeEl = document.getElementById('chatBadge');

  const ic = n => '<svg class="icon"><use href="#i-' + n + '"/></svg>';
  const cloudmark = () => '<svg class="icon cloudmark"><use href="#i-cloudmark"/></svg>';

  /* ---------- platform logos ---------- */
  const PLATFORMS = {
    marktplaats: { name: 'Marktplaats', kind: 'img', src: 'assets/logos/marktplaats.png' },
    vinted: { name: 'Vinted', kind: 'svg', color: '#09B1BA', path: 'M19.316 0c-.258 0-.571.217-1.415.953-.3.108-.627.027-1.008.613-2.15 3.09-3.825 14.648-5.255 17.984-.286-1.444-.885-10.837-1.116-13.41-.028-.477.027-1.076.027-1.43 0-2.368-.516-3.567-2.886-3.567-1.198 0-2.382.436-3.008 1.226-.299.408-.409.708-.409 1.443 0 4.915 1.171 12.973 2.478 18.228C7.132 23.688 8.603 24 9.99 24c.654 0 1.307-.081 2.233-.544 3.212-1.567 4.07-5.84 4.9-9.993.15-.749.899-4.37 1.253-6.275.476-2.6 1.02-5.54 1.347-6.617C19.833.245 19.63 0 19.317 0z' },
    ebay: { name: 'eBay', kind: 'svg', color: '#E53238', path: 'M6.056 12.132v-4.92h1.2v3.026c.59-.703 1.402-.906 2.202-.906 1.34 0 2.828.904 2.828 2.855 0 .233-.015.457-.06.668.24-.953 1.274-1.305 2.896-1.344.51-.018 1.095-.018 1.56-.018v-.135c0-.885-.556-1.244-1.53-1.244-.72 0-1.245.3-1.305.81h-1.275c.136-1.29 1.5-1.62 2.686-1.62 1.064 0 1.995.27 2.415 1.02l-.436-.84h1.41l2.055 4.125 2.055-4.126H24l-3.72 7.305h-1.346l1.07-2.04-2.33-4.38c.13.255.2.555.2.93v2.46c0 .346.01.69.04 1.005H16.8a6.543 6.543 0 01-.046-.765c-.603.734-1.32.96-2.32.96-1.48 0-2.272-.78-2.272-1.695 0-.15.015-.284.037-.405-.3 1.246-1.36 2.086-2.767 2.086-.87 0-1.694-.315-2.2-.93 0 .24-.015.494-.04.734h-1.18c.02-.39.04-.855.04-1.245v-1.05h-4.83c.065 1.095.818 1.74 1.853 1.74.718 0 1.355-.3 1.568-.93h1.24c-.24 1.29-1.61 1.725-2.79 1.725C.95 15.009 0 13.822 0 12.232c0-1.754.982-2.91 3.116-2.91 1.688 0 2.93.886 2.94 2.806v.005zm9.137.183c-1.095.034-1.77.233-1.77.95 0 .465.36.97 1.305.97 1.26 0 1.935-.69 1.935-1.814v-.13c-.45 0-.99.006-1.484.022h.012zm-6.06 1.875c1.11 0 1.876-.806 1.876-2.02s-.768-2.02-1.893-2.02c-1.11 0-1.89.806-1.89 2.02s.765 2.02 1.875 2.02h.03zm-4.35-2.514c-.044-1.125-.854-1.546-1.725-1.546-.944 0-1.694.474-1.815 1.546z' },
    facebook: { name: 'Facebook', kind: 'svg', color: '#0866FF', path: 'M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z' }
  };
  const PLATFORM_ORDER = ['marktplaats', 'ebay', 'vinted', 'facebook'];
  function platIcon(key, size) {
    size = size || 34;
    const p = PLATFORMS[key];
    const r = Math.round(size * .28);
    if (p.kind === 'img') return '<img src="' + p.src + '" alt="" width="' + size + '" height="' + size + '" style="width:' + size + 'px;height:' + size + 'px;border-radius:' + r + 'px;flex:none;display:block;object-fit:cover">';
    const g = Math.round(size * .56);
    return '<span style="width:' + size + 'px;height:' + size + 'px;border-radius:' + r + 'px;background:' + p.color + ';display:inline-flex;align-items:center;justify-content:center;flex:none" aria-hidden="true"><svg width="' + g + '" height="' + g + '" viewBox="0 0 24 24" fill="#fff"><path d="' + p.path + '"/></svg></span>';
  }
  function platLine(key, size) { return '<span class="row" style="gap:8px">' + platIcon(key, size) + '<span>' + PLATFORMS[key].name + '</span></span>'; }
  const APP_ICON = size => {
    size = size || 38;
    return '<span style="width:' + size + 'px;height:' + size + 'px;border-radius:' + Math.round(size * .22) + 'px;background:var(--lime);display:inline-flex;align-items:center;justify-content:center;flex:none" aria-hidden="true"><svg width="' + Math.round(size * .62) + '" height="' + Math.round(size * .5) + '" viewBox="34 24 138 116"><g fill="#0F2A18"><circle cx="66" cy="88" r="32"/><circle cx="100" cy="62" r="38"/><circle cx="134" cy="84" r="32"/><circle cx="150" cy="106" r="22"/><circle cx="100" cy="110" r="30"/><circle cx="60" cy="112" r="20"/></g></svg></span>';
  };

  function sticker(file, tilt) {
    return '<span class="ph cutout sticker" style="--tilt:' + tilt + 'deg"><img src="assets/' + file + '" alt=""></span>';
  }
  function stickerSized(file, tilt, size, id) {
    return '<span class="ph cutout sticker"' + (id ? ' id="' + id + '"' : '') + ' style="width:' + size + 'px;height:' + size + 'px;--tilt:' + tilt + 'deg"><img src="assets/' + file + '" alt=""></span>';
  }

  /* ---------- state ---------- */
  function freshWizard() { return { min: 130, goal: 160, taken: 1, cover: 0, cond: 2, when: 0, hand: 0 }; }
  function freshState() {
    return Object.assign(freshWizard(), {
      created: false, adLive: false, uploading: false,
      platformStatus: { marktplaats: 'queued', ebay: 'queued', vinted: 'queued', facebook: 'queued' },
      editingAd: false,
      tomOfferArrived: false, tomResolved: null,
      milaStage: 0, milaTyping: false, milaDealDone: false, milaPlayed: false,
      chatsBadge: 0,
      soldTimerStarted: false, sold: false, soldPrice: 140,
      milaComposer: '', tomComposer: '', takeover: false,
      viewedNegotiating: false
    });
  }
  let S = freshState();
  function tomOffer() { return Math.max(20, S.min - 15); }
  function milaCounter() { return Math.max(S.min + 20, 150); }
  function milaDeal() { return Math.min(S.goal - 1, Math.max(S.min + 10, 140)); }

  const HOME_ITEMS = [
    { id: 'egg', title: 'Egg chair', img: 'egg-chair-cutout.png', tilt: 3, price: 120 },
    { id: 'camera', title: 'Canon EOS R', img: 'camera-cutout.png', tilt: -2, price: 650 },
    { id: 'lamp', title: 'Table lamp', img: 'lamp-cutout.png', tilt: 4, price: 25 },
    { id: 'sneakers', title: 'Lilac sneakers', img: 'sneakers-cutout.png', tilt: -4, price: 35 },
    { id: 'guitar', title: 'Electric guitar', img: 'guitar-cutout.png', tilt: 2, price: 240 }
  ];

  /* ---------- background timers (survive navigation) ---------- */
  let bgTimers = [];
  function runChain(steps) {
    let t = 0;
    for (const s of steps) {
      if (typeof s === 'number') t += s;
      else { const fn = s; bgTimers.push(setTimeout(fn, t)); }
    }
  }
  function clearBg() { bgTimers.forEach(clearTimeout); bgTimers = []; }

  /* ---------- router ---------- */
  const ROOTS = ['home', 'chats'];
  let stack = [{ id: 'home', params: {} }];
  let currentLayer = null, currentId = null;

  const SCREENS = {
    home: renderHome, chats: renderChats,
    'sell-snap': renderSnap, 'sell-isit': renderIsIt, 'sell-when': renderWhen,
    'sell-min': renderMin, 'sell-handover': renderHandover, 'sell-working': renderWorking,
    'sell-ad': renderAd, product: renderProduct,
    'chat-mila': renderChatMila, 'chat-tom': renderChatTom, sold: renderSold
  };

  function go(id, params, opts) {
    opts = opts || {};
    params = params || {};
    let mode = opts.mode || (ROOTS.includes(id) ? 'tab' : 'push');
    let dir;
    if (mode === 'replace') { stack[stack.length - 1] = { id, params }; dir = 'fwd'; history.replaceState({ d: stack.length }, '', '#' + id); }
    else if (mode === 'tab') { stack = [{ id, params }]; dir = 'tab'; history.pushState({ d: 1 }, '', '#' + id); }
    else { stack.push({ id, params }); dir = 'fwd'; history.pushState({ d: stack.length }, '', '#' + id); }
    render(id, params, dir);
  }
  function navBack() { if (stack.length > 1) history.back(); }
  window.addEventListener('popstate', () => {
    if (stack.length > 1) { stack.pop(); const top = stack[stack.length - 1]; render(top.id, top.params, 'back'); }
  });

  function render(id, params, dir) {
    const layer = document.createElement('div');
    layer.className = 'layer';
    layer.innerHTML = SCREENS[id](params || {});
    if (dir === 'back') stageEl.insertBefore(layer, currentLayer);
    else stageEl.appendChild(layer);
    const old = currentLayer;
    if (reduceMotion) {
      layer.style.transform = 'none'; layer.style.opacity = '1';
      if (old) old.remove();
    } else {
      requestAnimationFrame(() => {
        if (dir === 'fwd') {
          layer.style.transform = 'translateX(100%)';
          requestAnimationFrame(() => {
            layer.style.transition = 'transform .32s var(--out)';
            layer.style.transform = 'translateX(0)';
            if (old) { old.style.transition = 'transform .32s var(--out), filter .32s var(--out)'; old.style.transform = 'translateX(-25%)'; old.style.filter = 'brightness(.9)'; }
          });
        } else if (dir === 'back') {
          layer.style.transform = 'translateX(-25%)'; layer.style.filter = 'brightness(.9)';
          requestAnimationFrame(() => {
            layer.style.transition = 'transform .32s var(--out), filter .32s var(--out)';
            layer.style.transform = 'translateX(0)'; layer.style.filter = 'none';
            if (old) { old.style.transition = 'transform .32s var(--out)'; old.style.transform = 'translateX(100%)'; }
          });
        } else {
          layer.style.opacity = '0';
          requestAnimationFrame(() => { layer.style.transition = 'opacity .18s var(--out)'; layer.style.opacity = '1'; });
        }
      });
      setTimeout(() => { if (old && old.parentNode) old.remove(); }, dir === 'tab' ? 220 : 380);
    }
    currentLayer = layer; currentId = id;
    updateTabbar(id);
    afterMount(id);
  }

  function refreshInPlace(id) {
    if (currentId !== id || !currentLayer) return;
    const top = stack[stack.length - 1];
    currentLayer.innerHTML = SCREENS[id](top.params || {});
  }

  function updateTabbar(id) {
    const isRoot = ROOTS.includes(id);
    tabbarEl.style.display = isRoot ? 'flex' : 'none';
    tabbarEl.querySelectorAll('.tab[data-tab]').forEach(b => b.toggleAttribute('aria-current', b.dataset.tab === id));
    tabbarEl.querySelectorAll('.tab[data-tab]').forEach(b => { if (b.dataset.tab === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    chatBadgeEl.hidden = S.chatsBadge <= 0;
    chatBadgeEl.textContent = S.chatsBadge;
  }

  function afterMount(id) {
    if (id === 'sell-working') runWorkingSteps();
    if (id === 'chat-mila') {
      if (!S.milaPlayed) { S.milaPlayed = true; playMila(); }
      startSoldCountdown();
    }
    if (id === 'sold') playSoldReveal();
    if (id === 'chats' && S.tomOfferArrived) S.viewedNegotiating = true;
  }

  /* ---------- delegated events ---------- */
  phoneEl.addEventListener('click', e => {
    const back = e.target.closest('[data-back]');
    if (back) { navBack(); return; }
    const goEl = e.target.closest('[data-go]');
    if (goEl) {
      const mode = goEl.dataset.mode;
      go(goEl.dataset.go, {}, mode ? { mode } : {});
      return;
    }
    const act = e.target.closest('[data-act]');
    if (act) { handleAction(act.dataset.act, act); return; }
  });
  phoneEl.addEventListener('change', e => {
    const act = e.target.closest('[data-actchange]');
    if (act) handleAction(act.dataset.actchange, act);
  });
  tabbarEl.addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    if (b.dataset.tab === 'sell') { go('sell-snap', {}, { mode: 'push' }); return; }
    go(b.dataset.tab, {}, { mode: 'tab' });
  });
  bannerEl.addEventListener('click', () => { if (bannerEl._onTap) bannerEl._onTap(); hideBanner(); });

  let bannerTimer = null;
  function showBanner(text, onTap, persist) {
    clearTimeout(bannerTimer);
    bannerEl.innerHTML = APP_ICON(38) + '<span class="btxt"><small>poof</small><b></b></span>';
    bannerEl.querySelector('b').textContent = text;
    bannerEl._onTap = onTap;
    bannerEl.classList.add('show');
    if (!persist) bannerTimer = setTimeout(hideBanner, 9000);
  }
  function hideBanner() { bannerEl.classList.remove('show'); }

  function handleAction(act, el) {
    switch (act) {
      case 'shutter': if (S.taken < 5) { S.taken++; refreshInPlace('sell-snap'); } break;
      case 'photo-remove': S.taken = Math.max(0, S.taken - 1); refreshInPlace('sell-snap'); break;
      case 'cover-set': S.cover = +el.dataset.i; refreshInPlace('sell-isit'); break;
      case 'cond-set': S.cond = +el.dataset.i; refreshInPlace('sell-isit'); break;
      case 'when-set': S.when = +el.dataset.i; refreshInPlace('sell-when'); break;
      case 'min-minus': S.min = Math.max(5, S.min - 5); if (S.goal <= S.min) S.goal = S.min + 5; refreshInPlace('sell-min'); break;
      case 'min-plus': S.min = Math.min(495, S.min + 5); if (S.goal <= S.min) S.goal = S.min + 5; refreshInPlace('sell-min'); break;
      case 'goal-minus': S.goal = Math.max(S.min + 5, S.goal - 5); refreshInPlace('sell-min'); break;
      case 'goal-plus': S.goal = Math.min(999, S.goal + 5); refreshInPlace('sell-min'); break;
      case 'hand-set': S.hand = +el.dataset.i; refreshInPlace('sell-handover'); break;
      case 'edit-toggle': S.editingAd = !S.editingAd; refreshInPlace('sell-ad'); break;
      case 'approve':
        S.created = true;
        go('product', {}, { mode: 'push' });
        startUpload();
        break;
      case 'pause-toggle': S.paused = !S.paused; refreshInPlace('product'); break;
      case 'open-chats': go('chats', {}, { mode: 'tab' }); break;
      case 'takeover-toggle': S.takeover = !S.takeover; refreshInPlace('chat-mila'); break;
      case 'mila-send': {
        const inp = currentLayer.querySelector('#milaInput');
        if (inp && inp.value.trim()) { S.milaYouMsgs = (S.milaYouMsgs || []).concat(inp.value.trim()); refreshInPlace('chat-mila'); }
        break;
      }
      case 'tom-counter': {
        S.tomResolved = 'counter';
        S.tomYouOffer = S.min;
        refreshInPlace('chat-tom');
        startSoldCountdown();
        break;
      }
      case 'tom-accept': S.tomResolved = 'accept'; refreshInPlace('chat-tom'); break;
      case 'tom-decline': S.tomResolved = 'decline'; refreshInPlace('chat-tom'); break;
      case 'tom-send': {
        const inp = currentLayer.querySelector('#tomInput');
        if (inp && inp.value.trim()) { S.tomYouMsgs = (S.tomYouMsgs || []).concat(inp.value.trim()); refreshInPlace('chat-tom'); }
        break;
      }
      case 'sell-else': {
        Object.assign(S, freshWizard());
        go('sell-snap', {}, { mode: 'push' });
        break;
      }
    }
  }

    S.platformStatus = { marktplaats: 'queued', ebay: 'queued', vinted: 'queued', facebook: 'queued' };
    const order = ['marktplaats', 'ebay', 'vinted', 'facebook'];
    const steps = [];
    order.forEach((key, i) => {
      steps.push(() => { S.platformStatus[key] = 'uploading'; if (i > 0) S.platformStatus[order[i - 1]] = 'live'; refreshInPlace('product'); });
      steps.push(650);
    });
    steps.push(() => {
      S.platformStatus[order[order.length - 1]] = 'live';
      S.uploading = false; S.adLive = true;
      refreshInPlace('product');
      onAdLive();
    });
    runChain(steps);
  }
  function onAdLive() {
    showBanner('Your PS4 is live on 4 platforms', () => { if (currentId !== 'product') go('product', {}, { mode: 'push' }); });
    runChain([3000, () => {
      S.tomOfferArrived = true; S.chatsBadge = 1;
      refreshInPlace('chats'); refreshInPlace('product');
      showBanner('Tom offered €' + tomOffer() + ', below your €' + S.min, () => go('chat-tom', {}, { mode: 'push' }));
    }]);
  }
  function renderProduct() {
    const rows = PLATFORM_ORDER.map(key => {
      const st = S.platformStatus[key];
      const label = st === 'live' ? 'Live' : st === 'uploading' ? 'Posting' : 'Queued';
      const sub = st === 'live' ? 'Live · just now' : st === 'uploading' ? 'Uploading photos' : 'Waiting its turn';
      const pct = st === 'live' ? 100 : st === 'uploading' ? 55 : 0;
      return '<li><div class="row">' + platIcon(key, 34) + '<div class="grow"><b>' + PLATFORMS[key].name + '</b><span>' + sub + '</span></div><span class="chip ' + (st === 'live' ? 'solid' : '') + '">' + label + '</span></div>' + (st === 'queued' && !S.adLive ? '' : '<div class="bar-prog"><i style="width:' + pct + '%"></i></div>') + '</li>';
    }).join('');
    const stageIdx = S.sold ? 3 : (S.tomOfferArrived || S.milaStage > 0) ? 2 : S.adLive ? 1 : 0;
    const seg4 = ['Live', 'Offers', 'Negotiating', 'Sold'].map((l, i) => '<span class="' + (i === stageIdx ? 'cur' : '') + '">' + l + '</span>').join('');
    const seg4bars = [0, 1, 2, 3].map(i => '<i class="' + (i <= stageIdx ? 'on' : '') + '"></i>').join('');
    const chatCount = (S.adLive ? 1 : 0) + (S.tomOfferArrived ? 1 : 0);
    const nowText = S.sold ? 'Sold for €' + S.soldPrice : (S.tomOfferArrived ? 'Poof is answering 1 new message' : S.adLive ? 'Poof is watching for offers' : 'Getting ready to go live');
    return `
      <div class="body2 has-nav" style="padding:0">
        <div class="hero">
          <span class="ph"><img src="assets/ps4-photo.jpg" alt="PlayStation 4 Slim, ad photo"></span>
          <button class="icon-btn l" type="button" aria-label="Back" data-back>${ic('back')}</button>
        </div>
        <div style="padding:18px 20px 24px">
          <p class="xs muted">Amsterdam · listed just now</p>
          <h1 class="q" style="font-size:24px;margin-top:2px">PlayStation 4 Slim, 500 GB</h1>
          <p class="sec">${S.uploading ? 'Going live' : 'Live on'}</p>
          <ul class="plat-list card divided" style="box-shadow:var(--shadow-soft)">${rows}</ul>
          <div class="seg4" style="margin-top:20px" aria-label="Status">${seg4bars}${seg4}</div>
          <div class="tiles" style="margin-top:16px">
            <div class="tile"><b>${S.adLive ? 142 : 0}</b><span>views</span></div>
            <div class="tile"><b>${S.adLive ? 6 : 0}</b><span>saves</span></div>
            <div class="tile"><b>${chatCount}</b><span>chats</span></div>
          </div>
          ${S.adLive ? '<button class="now-row" type="button" data-act="open-chats"><span class="dot"></span><span class="grow">' + nowText + '</span>' + ic('right') + '</button>' : ''}
        </div>
      </div>
      <div class="actionbar">
        <div><p class="xs muted">Asking</p><b>€${S.sold ? S.soldPrice : S.goal}</b> <span class="muted">/ min €${S.min}</span></div>
        ${S.adLive ? '<button class="btn" type="button" style="width:auto" data-act="open-chats">Open chats</button>' : ''}
      </div>`;
  }

  /* ---------- chats ---------- */
  function renderChats() {
    let ps4Group = '';
    if (S.adLive) {
      const needsRow = S.tomOfferArrived ? `
        <p class="subhead">Needs you</p>
        <button class="chat-row needs" type="button" data-go="chat-tom">
          <span class="avatar">T<span class="pl">${platIcon('marktplaats', 20)}</span></span>
          <span class="grow"><span class="top-line"><b>Tom</b>${S.tomResolved ? '' : '<span class="un" aria-label="1 unread">1</span>'}</span><span class="last">${S.tomResolved ? 'Resolved' : 'Would you take €' + tomOffer() + '? I can come tonight.'}</span></span>
          <span class="side"><span class="offer-pill">€${tomOffer()}</span></span>
        </button>` : '';
      const milaLast = S.sold ? 'Deal at €' + S.soldPrice : S.milaStage > 0 ? 'Poof is negotiating' : 'Poof answered';
      ps4Group = `
        <div class="group">
          <button class="group-head" type="button" data-go="product">${sticker('ps4-cutout.png', -2)}<div class="grow"><b>PlayStation 4 Slim</b><span>${chatSummary()}</span></div>${ic('right')}</button>
          ${needsRow}
          <p class="subhead">Handled by Poof</p>
          <button class="chat-row calm" type="button" data-go="chat-mila">
            <span class="avatar">M<span class="pl">${platIcon('marktplaats', 20)}</span></span>
            <span class="grow"><span class="top-line"><b class="normal">Mila</b><span class="cloudtag">${cloudmark()}</span></span><span class="last">${S.milaTyping ? '<span class="typing"><i></i><i></i><i></i></span>Poof is negotiating' : milaLast}</span></span>
            <span class="side"><span class="offer-pill">€${S.sold ? S.soldPrice : milaDeal()}</span></span>
          </button>
        </div>`;
    }
    return `
      <div class="body2 has-nav" style="padding-top:28px">
        <h1 class="q" style="font-size:28px">Chats</h1>
        <p class="sub" style="margin-bottom:18px">Per ad. What needs you comes first.</p>
        ${ps4Group}
        <div class="group">
          <button class="group-head" type="button">${sticker('egg-chair-cutout.png', 3)}<div class="grow"><b>Egg chair</b><span>2 chats · best offer €175</span></div>${ic('right')}</button>
          <button class="chat-row calm" type="button">
            <span class="avatar">S<span class="pl">${platIcon('marktplaats', 20)}</span></span>
            <span class="grow"><span class="top-line"><b class="normal">Sanne</b><span class="cloudtag">${cloudmark()}</span></span><span class="last">Poof answered</span></span>
            <span class="side"><span class="offer-pill">€175</span></span>
          </button>
        </div>
        ${!S.adLive ? '<p class="muted small">Once your PS4 ad is live, its chats show up here.</p>' : ''}
      </div>`;
  }
  function chatSummary() {
    if (S.sold) return 'Sold for €' + S.soldPrice;
    const n = (S.tomOfferArrived ? 1 : 0) + 1;
    return n + ' chats · best offer €' + (S.tomOfferArrived ? Math.max(tomOffer(), milaDeal()) : milaDeal());
  }

  /* ---------- Mila thread ---------- */
  function milaScript() {
    const c = milaCounter(), d = milaDeal();
    return [
      { from: 'buyer', text: 'Hi! Is the PS4 still available?' },
      { from: 'poof', text: 'Yes! Pickup in Amsterdam.' },
      { from: 'buyer', text: 'Would you take 100?', offer: 100, kind: 'Offer' },
      { from: 'poof', text: 'It’s in great shape with two controllers. I can do ' + c + '.', offer: c, kind: 'Counter' },
      { from: 'buyer', text: d + ' and I pick it up Saturday?', offer: d, kind: 'Offer' },
      { from: 'poof', text: 'Deal! Saturday 14:00 works.', offer: d, kind: 'Accepted', accepted: true }
    ];
  }
  function renderChatMila() {
    const script = milaScript();
    const msgs = script.slice(0, S.milaStage).map(m => {
      const cls = m.from === 'buyer' ? 'msg buyer' : 'msg agent-m';
      const who = m.from === 'buyer' ? '<span class="who">Mila</span>' : '<span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>';
      const offerHtml = m.offer != null ? '<div class="offer-card' + (m.accepted ? ' accepted' : '') + '"><small>' + m.kind + '</small><b>€' + m.offer + '</b></div>' : '';
      return '<div class="' + cls + '">' + who + offerHtml + m.text + '</div>';
    }).join('');
    const typing = S.milaTyping ? '<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span></div>' : '';
    const deal = S.milaDealDone ? '<div class="deal"><span class="cal"><small>Sat</small><b>26</b></span><div><b>Deal at €' + (S.sold ? S.soldPrice : milaDeal()) + '</b><span class="small muted">Pickup Saturday 14:00 · address shared with Mila</span></div></div>' : '';
    const youMsgs = (S.milaYouMsgs || []).map(t => '<div class="msg you"><span class="who">You</span>' + escapeHtml(t) + '</div>').join('');
    return `
      <div class="top2"><button class="icon-btn" type="button" aria-label="Back" data-back>${ic('back')}</button>
        <div class="grow"><h1 class="bar-title" style="font-size:17px">Mila <span class="chip">Serious buyer</span></h1><span class="xs muted">Marktplaats</span></div>
      </div>
      <div class="item-row">${sticker('ps4-cutout.png', -2)}<div class="grow"><b class="small">PlayStation 4 Slim</b><span>€${S.goal}, never below €${S.min}</span></div></div>
      <div class="body2"><div class="thread"><span class="day">Today</span>${msgs}${typing}${deal}${youMsgs}</div></div>
      <div class="composer">
        <div class="row"><label class="sr" for="milaInput">Your message</label><input id="milaInput" type="text" placeholder="Say something (optional)"><button class="icon-btn" type="button" data-act="mila-send" aria-label="Send">${ic('send')}</button></div>
      </div>`;
  }
  function playMila() {
    const script = milaScript();
    const steps = [];
    script.forEach(() => {
      steps.push(() => { S.milaTyping = true; refreshInPlace('chat-mila'); });
      steps.push(750);
      steps.push(() => { S.milaTyping = false; S.milaStage++; refreshInPlace('chat-mila'); });
      steps.push(550);
    });
    steps.push(() => { S.milaDealDone = true; refreshInPlace('chat-mila'); refreshInPlace('chats'); });
    runChain(steps);
  }

  /* ---------- Tom chat ---------- */
  function renderChatTom() {
    const t = tomOffer();
    const decisionMsgs = [];
    decisionMsgs.push('<div class="msg buyer"><span class="who">Tom</span>Would you take €' + t + '? I can come tonight.</div>');
    decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>Tom offered €' + t + ', below your €' + S.min + '. Counter at €' + S.min + '?</div>');
    if (S.tomResolved === 'counter') {
      decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span><div class="offer-card"><small>Counter</small><b>€' + S.min + '</b></div>I can do ' + S.min + '.</div>');
    } else if (S.tomResolved === 'accept') {
      decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span><div class="offer-card accepted"><small>Accepted</small><b>€' + t + '</b></div>Deal, thanks!</div>');
    } else if (S.tomResolved === 'decline') {
      decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>Sorry, can’t go that low. Thanks for the interest!</div>');
    }
    const youMsgs = (S.tomYouMsgs || []).map(txt => '<div class="msg you"><span class="who">You</span>' + escapeHtml(txt) + '</div>').join('');
    const chips = !S.tomResolved ? `
      <div class="qr">
        <button class="qrbtn primary" type="button" data-act="tom-counter">Counter €${S.min}</button>
        <button class="qrbtn secondary" type="button" data-act="tom-accept">Accept €${t}</button>
        <button class="qrbtn secondary" type="button" data-act="tom-decline">Decline</button>
      </div>` : '';
    return `
      <div class="top2"><button class="icon-btn" type="button" aria-label="Back" data-back>${ic('back')}</button>
        <div class="grow"><h1 class="bar-title" style="font-size:17px">Tom</h1><span class="xs muted">Marktplaats</span></div>
      </div>
      <div class="item-row">${sticker('ps4-cutout.png', 2)}<div class="grow"><b class="small">PlayStation 4 Slim</b><span>€${S.goal}, never below €${S.min}</span></div></div>
      <div class="body2"><div class="thread"><span class="day">Today</span>${decisionMsgs.join('')}${youMsgs}</div></div>
      ${chips}
      <div class="composer">
        <div class="row"><label class="sr" for="tomInput">Your message</label><input id="tomInput" type="text" placeholder="Or type your own message"><button class="icon-btn" type="button" data-act="tom-send" aria-label="Send">${ic('send')}</button></div>
      </div>`;
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  /* ---------- sold, deal timing ---------- */
  function startSoldCountdown() {
    if (S.soldTimerStarted || S.sold) return;
    S.soldTimerStarted = true;
    runChain([8000, soldEvent]);
  }
  function soldEvent() {
    if (S.sold) return;
    S.sold = true;
    S.soldPrice = milaDeal();
    S.milaStage = milaScript().length;
    S.milaDealDone = true;
    refreshInPlace('chats'); refreshInPlace('chat-mila'); refreshInPlace('product');
    showBanner('Sold for €' + S.soldPrice, () => go('sold', {}, { mode: 'push' }), true);
  }

  /* ---------- sound ---------- */
  const sfxPool = (src, vol) => {
    let pool = null;
    const build = () => Array.from({ length: 2 }, () => { const a = new Audio(src); a.preload = 'auto'; a.volume = vol; return a; });
    let n = 0;
    return () => { try { if (!pool) pool = build(); const a = pool[n++ % pool.length]; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} };
  };
  const sndItem = sfxPool('assets/poof-item.mp3', .5);
  const sndDone = sfxPool('assets/poof-success.mp3', .6);
  function spritePoofIn(container, el, scale) {
    const r = el.getBoundingClientRect(), h = container.getBoundingClientRect();
    const size = Math.max(90, Math.min(260, Math.max(r.width, r.height) * (scale || 1.6)));
    const fx = document.createElement('span');
    fx.className = 'poof-fx';
    Object.assign(fx.style, { width: size + 'px', height: size + 'px', left: (r.left + r.width / 2 - h.left - size / 2) + 'px', top: (r.top + r.height / 2 - h.top - size / 2) + 'px' });
    container.appendChild(fx);
    fx.addEventListener('animationend', () => { setTimeout(() => { fx.classList.add('out'); setTimeout(() => fx.remove(), 400); }, 200); }, { once: true });
  }
  function poofSticker(container, stickerEl, scale, onDone) {
    if (reduceMotion) { stickerEl.style.visibility = 'hidden'; sndDone(); onDone && onDone(); return; }
    stickerEl.animate([
      { transform: 'scale(1,1)', opacity: 1 },
      { transform: 'scale(1.14,.84)', opacity: 1, offset: .45 },
      { transform: 'scale(.86,1.18)', opacity: 1, offset: .75 },
      { transform: 'scale(0,0)', opacity: 0 }
    ], { duration: 300, easing: 'ease-in', fill: 'forwards' });
    setTimeout(() => { sndItem(); spritePoofIn(container, stickerEl, scale); }, 190);
    setTimeout(() => { sndDone(); onDone && onDone(); }, 850);
  }

  function renderSold() {
    return `
      <div class="soldphone" style="flex:1;display:flex;flex-direction:column">
        <div class="soldstage" id="soldStage">
          ${stickerSized('ps4-cutout.png', 0, 210, 'soldSticker')}
          <div class="sold-text" id="soldText"><p class="big"><span class="pb">Sold</span> for €${S.soldPrice}</p><p class="muted">PlayStation 4 Slim, to Mila</p></div>
          <div class="next-panel" id="soldPanel">
            <p class="sec" style="margin-top:0">Next</p>
            <ol class="timeline">
              <li class="done"><div><b>Pickup Saturday 14:00</b><span>with Mila</span></div></li>
              <li><div><b>Get paid €${S.soldPrice}</b><span>Mila pays at pickup</span></div></li>
            </ol>
            <div class="card recap divided pad" style="box-shadow:var(--shadow-soft);margin-top:10px">
              <div><span>Time to sell</span><b>2 days</b></div>
              <div><span>Messages handled</span><b>14</b></div>
              <div><span>Counter offers</span><b>${S.tomResolved ? 3 : 2}</b></div>
            </div>
            <p class="sec">Removed from</p>
            <div class="rchips" style="margin-top:2px">
              ${PLATFORM_ORDER.map(k => '<span>' + platIcon(k, 20) + ic('check') + PLATFORMS[k].name + '</span>').join('')}
            </div>
            <button class="btn" type="button" data-act="sell-else" style="margin-top:18px">Sell something else</button>
          </div>
        </div>
      </div>`;
  }
  function playSoldReveal() {
    const layer = currentLayer;
    const stage = layer.querySelector('#soldStage');
    const stickerEl = layer.querySelector('#soldSticker');
    const text = layer.querySelector('#soldText');
    const panel = layer.querySelector('#soldPanel');
    runChain([260, () => {
      poofSticker(stage, stickerEl, 1.8, () => {
        text.classList.add('show');
        runChain([250, () => panel.classList.add('show')]);
      });
    }]);
  }

  /* ---------- home ---------- */
  function renderHome() {
    let ps4Tile = '';
    if (S.created) {
      const priceTag = S.sold
        ? '<span class="pricetag sold" style="--tilt:6deg">€' + S.soldPrice + '</span>'
        : '<span class="pricetag" style="--tilt:6deg">€' + S.goal + '</span>';
      ps4Tile = '<li><button class="gtile" type="button" data-go="product"><span class="stickerwrap">' + sticker('ps4-cutout.png', -3) + priceTag + '</span><span class="t">PlayStation 4 Slim' + (S.sold ? ' · Sold' : '') + '</span></button></li>';
    }
    const others = HOME_ITEMS.map(it => '<li><button class="gtile" type="button"><span class="stickerwrap">' + sticker(it.img, it.tilt) + '<span class="pricetag" style="--tilt:-5deg">€' + it.price + '</span></span><span class="t">' + it.title + '</span></button></li>').join('');
    return `
      <div class="body2 has-nav" style="padding-top:28px">
        <div class="home-head"><h1>Your ads</h1><span class="avatar">T</span></div>
        <ul class="grid-ads">${ps4Tile}${others}</ul>
      </div>`;
  }

  /* ---------- restart ---------- */
  function restart() {
    clearBg();
    S = freshState();
    hideBanner();
    stack = [{ id: 'home', params: {} }];
    if (currentLayer) currentLayer.remove();
    currentLayer = null;
    history.replaceState({ d: 1 }, '', '#home');
    render('home', {}, null);
  }
  document.getElementById('restart').addEventListener('click', restart);
  window.__poofRestart = restart;
  window.__poofState = () => S;
  window.__poofGo = go;

  /* ---------- boot ---------- */
  const initialId = SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
  stack = [{ id: initialId, params: {} }];
  history.replaceState({ d: 1 }, '', '#' + initialId);
  render(initialId, {}, null);
})();
</script>
</body>
</html>
