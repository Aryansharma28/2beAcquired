<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>poof</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poof">
<meta name="theme-color" content="#F4F6F4">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#D7F57A; --ink:#0F2A18; --moss:#4A5F50; --limetint:#EEFBC8;
  --page:#F4F6F4; --surface:#FFFFFF; --line:#E1E8E3; --alert:#D93A3F;
  --shadow-soft:0 1px 3px rgba(15,42,24,.08);
  --shadow-float:0 10px 30px rgba(15,42,24,.18);
  --out:cubic-bezier(.22,1,.36,1);
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 'Figtree',system-ui,sans-serif;color:var(--ink);background:var(--page);-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
p{margin:0}
img{display:block;max-width:100%}

/* hand marker + puff divider */
.pb{background:var(--lime);padding:0 12px;border-radius:14px 5px 16px 7px / 9px 15px 7px 13px;display:inline-block;transform:rotate(-1.5deg)}
.pline{height:14px;background:radial-gradient(circle at 50% 0,var(--line) 62%,transparent 66%) top left/20px 14px round no-repeat}

/* type */
.q{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--moss);margin-bottom:20px}
.eyebrow{font-size:13px;color:var(--moss);font-weight:600}
.sec{font-size:12px;font-weight:700;color:var(--moss);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec a,.sec button{font-size:13px;color:var(--ink);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-weight:700}
.muted{color:var(--moss)}
.small{font-size:14px}
.xs{font-size:13px}
.num-big{font-variant-numeric:tabular-nums}

/* icon buttons / icons */
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-soft);cursor:pointer;padding:0;color:var(--ink)}
.icon-btn.plain{box-shadow:none;background:transparent}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.cloudmark{fill:currentColor;stroke:none;width:11px;height:9px}
.icon.cta-ic{width:18px;height:18px;stroke-width:2.6;transition:transform .35s var(--spring)}
.bar-title{font-weight:700;font-size:17px;margin:0}

/* photos: real cutouts / photos */
.ph{display:block;position:relative;background:var(--limetint);border-radius:12px;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.cutout{background:transparent;overflow:visible}
.ph.cutout img{object-fit:contain}
.ph-note{position:absolute;z-index:1;right:8px;bottom:8px;background:var(--surface);border-radius:999px;font-size:12px;padding:2px 8px;font-weight:600;box-shadow:var(--shadow-soft)}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--limetint);border:0;display:grid;place-items:center;font-weight:800;position:relative;font-size:15px;color:var(--ink)}
.avatar .pl{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:6px;background:var(--surface);box-shadow:var(--shadow-soft);display:grid;place-items:center;overflow:hidden}
.avatar .pl img,.avatar .pl svg{width:100%;height:100%}
/* chat row avatar: the platform is the big, primary shape; who it is sits as a small badge on top */
.pavatar{position:relative;flex:none}
.pavatar .who{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--limetint);color:var(--ink);font-weight:800;font-size:11px;display:grid;place-items:center;box-shadow:var(--shadow-soft);border:2px solid var(--surface)}
.poofsaid{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--ink);margin-right:3px}
.poofsaid .icon.cloudmark{color:var(--moss)}

/* sticker photos: landing sticker filter + slight tilt, shadow kept subtle and never clipped */
.sticker{transform:rotate(var(--tilt,-2deg))}
.sticker img{filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(15,42,24,.12))}
.stickerwrap{position:relative;overflow:visible}

/* price tags: paper tag with a notch and punched hole, no string */
.pricetag{position:absolute;top:2px;right:0;z-index:2;padding:4px 9px 4px 16px;color:var(--ink);
  font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;
  transform:rotate(var(--tilt,4deg));filter:drop-shadow(0 1px 2px rgba(15,42,24,.16))}
.pricetag::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:4px;
  background:radial-gradient(circle at 8px 50%,var(--page) 0 2.2px,transparent 2.6px),var(--lime);
  clip-path:polygon(0 50%,9px 0,100% 0,100% 100%,9px 100%)}
.pricetag.sold{color:var(--surface)}
.pricetag.sold::before{background:radial-gradient(circle at 8px 50%,var(--page) 0 2.2px,transparent 2.6px),var(--ink)}
.gtile.is-sold .sticker img{opacity:.55}
.gtile.is-sold .t{color:var(--moss)}
.gtile.is-pending .sticker img{opacity:.8}

/* home segmented control (styleguide: segmented control) */
.homeseg{display:flex;padding:4px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-soft);margin:0 0 22px}
.homeseg button{flex:1;height:38px;border:0;border-radius:19px;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--moss);cursor:pointer}
.homeseg button span{font-variant-numeric:tabular-nums;opacity:.7;margin-left:2px}
.homeseg button[aria-selected="true"]{background:var(--lime);color:var(--ink)}

/* buttons */
.btn{min-height:52px;width:100%;border-radius:999px;border:0;background:var(--ink);color:var(--lime);font-weight:700;font-size:16px;cursor:pointer;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .35s var(--spring)}
.btn:hover{transform:translateY(-1px)}
.btn:hover .cta-ic{transform:translateX(4px)}
.btn.secondary{background:var(--surface);color:var(--ink);min-height:44px;box-shadow:var(--shadow-soft);font-size:15px;width:auto}
.btn.ghost{background:none;color:var(--ink);text-decoration:underline;min-height:44px;font-weight:600}
.btn.small{width:auto;min-height:34px;padding:0 14px;font-size:13px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:700}
.btn:disabled{background:var(--line);color:var(--moss);cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.card{border-radius:20px;background:var(--surface)}
.pad{padding:16px}
.divided > *{border-top:1px solid var(--line)}
.divided > *:first-child{border-top:0}
.tag{display:inline-flex;align-items:center;font-size:12px;line-height:1.5;border-radius:4px;padding:1px 6px;font-weight:700;background:var(--limetint);color:var(--ink);white-space:nowrap}
.agenttag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--lime);font-size:11px;font-weight:800;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap;background:var(--surface);box-shadow:var(--shadow-soft)}
.chip.solid{background:var(--ink);color:#fff;box-shadow:none}
.un{min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink);flex:none}
.agent{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;font-size:14px;background:var(--limetint)}
.chevron{color:var(--moss)}
.cloudtag{display:inline-flex;width:15px;height:15px;flex:none;border-radius:4px;background:var(--ink);color:var(--lime);align-items:center;justify-content:center}

/* wizard header */
.wizbar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.wizbar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .5s var(--out)}
.step-count{font-size:13px;color:var(--moss);font-variant-numeric:tabular-nums;white-space:nowrap}
.context{display:flex;align-items:center;gap:8px;border-radius:14px;padding:6px 10px;margin:4px 0 16px;background:var(--surface);box-shadow:var(--shadow-soft);overflow:visible}
.context .ph{width:28px;height:28px}
.context .info{display:flex;align-items:baseline;gap:6px;font-size:13px;min-width:0;overflow:hidden}
.context b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context span{color:var(--moss);white-space:nowrap}

/* radio chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{position:relative}
.rchip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.rchip span{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-soft);font-weight:600}
.rchip input:checked + span{background:var(--ink);color:#fff;box-shadow:none}
.rchip input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}

/* navbar: four equal items, one lime indicator pill slides behind the active one */
#tabbar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);height:64px;padding:0 6px;border-radius:32px;background:var(--ink);display:flex;align-items:stretch;box-shadow:var(--shadow-float);z-index:30}
#tabbar .tab-indicator{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:26px;background:var(--lime);transition:transform .32s var(--spring),width .32s var(--spring);z-index:0;pointer-events:none}
#tabbar .tab{flex:1;min-width:0;border:0;background:none;color:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 4px;position:relative;z-index:1;font-size:12.5px;font-weight:700;transition:color .3s var(--out),transform .3s var(--spring)}
#tabbar .tab .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s var(--out)}
#tabbar .tab[aria-current="page"]{color:var(--ink)}
#tabbar .ico{position:relative;display:inline-flex}
.tbadge{position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;border-radius:8px;background:#fff;color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 3px}
#tabbar .tab[aria-current="page"] .tbadge{background:var(--ink);color:var(--lime)}
.body2.has-nav{padding-bottom:112px}

/* camera */
.top2.cam{justify-content:space-between}
.viewfinder{position:relative;flex:1;margin:0 16px;border-radius:20px;overflow:hidden;background:var(--ink)}
.viewfinder img,.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.vf-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,42,24,.55),transparent 42%)}
.flash-overlay{position:absolute;inset:0;background:#fff;opacity:0;z-index:3;pointer-events:none}
.pill.quiet{background:var(--surface);color:var(--moss);box-shadow:var(--shadow-soft);font-weight:600}
.corner{position:absolute;width:34px;height:34px;border:3px solid var(--lime);z-index:1}
.corner.tl{top:56px;left:22px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.corner.tr{top:56px;right:22px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.corner.bl{bottom:84px;left:22px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.corner.br{bottom:84px;right:22px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.pill{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.viewfinder .agent{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;background:var(--surface)}
.slots{display:flex;gap:8px;padding:14px 20px 4px}
.slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer}
.slot .box{width:100%;aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--moss);position:relative;background:var(--surface)}
.slot.filled .box{border:0;background:var(--limetint);overflow:hidden}
.slot.filled .box img{width:100%;height:100%;object-fit:cover}
.slot.next .box{border-color:var(--ink);border-style:solid}
.slot span{font-size:12px;color:var(--moss);font-weight:600}
.slot .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:1}
.slot .x .icon{width:12px;height:12px;stroke-width:2.6}
.cam-count{text-align:center;font-size:13px;color:var(--moss);margin:6px 0 0;font-weight:600}
.cam-controls{display:flex;align-items:center;justify-content:space-between;padding:10px 24px 24px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);background:#fff;cursor:pointer;position:relative;padding:0}
.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--lime)}
.shutter:disabled{opacity:.4;cursor:not-allowed}

.cover{position:relative;display:block;width:100%;height:230px;border:0;padding:0;background:none;cursor:pointer}
.cover .ph{width:100%;height:100%;border-radius:20px}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs button{flex:0 0 58px;width:58px;height:58px;padding:0;border:0;background:none;cursor:pointer}
.thumbs .ph{width:100%;height:100%;border-radius:10px}
.thumbs button[aria-pressed="true"] .ph{box-shadow:0 0 0 2px var(--ink)}
.recog{margin-top:18px}
.recog h2{font-size:24px;margin:2px 0 2px;font-weight:800;letter-spacing:-.02em}
.helper{font-size:13px;color:var(--moss);margin-top:8px}
.dl{margin:0}
.dl div{display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;min-height:52px}
.dl dt{color:var(--moss);width:84px;flex:none;font-size:14px}
.dl dd{margin:0;flex:1;font-weight:700}

.tabs{display:flex;padding:4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-soft)}
.tabs button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:600;color:var(--moss);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--lime);color:var(--ink)}
.tradeoff{font-size:18px;font-weight:700;margin:18px 0 8px}

.stepper{display:flex;align-items:center;justify-content:space-between;padding:14px 14px;box-shadow:var(--shadow-soft)}
.stepper .icon-btn{width:52px;height:52px;border-radius:50%}
.price-big{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.histo{position:relative;height:76px;display:flex;align-items:flex-end;gap:3px;padding:0 2px;margin-top:38px}
.histo i{flex:1;background:var(--ink);border-radius:3px 3px 0 0}
.histo i.below{background:var(--line)}
.histo .marker{position:absolute;top:-18px;bottom:-6px;width:1.5px;background:var(--moss);transform:translateX(-1px);z-index:1}
.histo .marker span{position:absolute;top:-2px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-soft);border-radius:999px;padding:2px 9px}
.histo .marker.goal{top:-36px;background:var(--ink)}
.histo .marker.goal span{background:var(--ink);color:var(--lime)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--moss);margin-top:6px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:8px}
.promise{display:flex;gap:12px;align-items:flex-start;background:var(--limetint);border-radius:16px;padding:14px 16px;margin-top:18px}
.promise b{display:block;font-weight:700}
.goalrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.goalrow .stepper{flex:none;padding:8px 10px;gap:10px}
.goalrow .stepper .icon-btn{width:36px;height:36px}
.goalrow .price-big{font-size:22px}
.goalrow b.lbl{font-size:14px;font-weight:700}

.option{border-radius:20px;margin-bottom:10px;background:var(--surface);box-shadow:var(--shadow-soft)}
.option > label{display:flex;align-items:flex-start;gap:12px;padding:16px;cursor:pointer}
.option > label input{width:22px;height:22px;accent-color:#0F2A18;margin:2px 0 0;flex:none}
.option > label .grow{flex:1}
.option > label b{display:flex;align-items:center;gap:8px;font-weight:700}
.option.checked{box-shadow:0 0 0 2px var(--ink)}
.option .more{padding:0 16px 16px 50px;display:none;flex-direction:column;gap:12px}
.option.checked .more{display:flex}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--moss);font-weight:600}
.field input[type=text]{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
fieldset{border:0;margin:0;padding:0}
legend{padding:0;font-size:13px;color:var(--moss);margin-bottom:6px;font-weight:600}
.more .rchip span{min-height:40px;padding:0 14px}
.pickup-sum{justify-content:space-between}
.pickup-sum span{font-weight:600}

.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;padding:14px 16px}
.st-ico{width:26px;height:26px;flex:none;border-radius:50%;background:var(--line);display:grid;place-items:center;margin-top:1px;color:transparent}
.st-ico .icon{width:14px;height:14px;stroke-width:2.6;display:none}
.step[data-state="done"] .st-ico{background:var(--ink);color:#fff}
.step[data-state="done"] .st-ico .icon{display:block}
.step[data-state="running"] .st-ico{background:var(--lime);color:var(--ink)}
.step[data-state="running"]{background:var(--limetint);border-radius:16px}
.step[data-state="next"]{color:var(--moss)}
.step .grow{flex:1;min-width:0}
.step b{display:block;font-weight:700}

.gallery{position:relative}
.gallery .ph.main{width:100%;height:230px;border-radius:20px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.ad-title{font-size:20px;font-weight:800;line-height:1.25;margin-top:14px}
.price-row{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.price-row .p{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid2 div{padding:12px 16px}
.grid2 div:nth-child(even){border-left:1px solid var(--line)}
.grid2 span{display:block;font-size:12px;color:var(--moss)}
.grid2 b{font-size:14px;font-weight:700}
.plat-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptog{position:relative}
.ptog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ptog > span{min-width:0;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-soft)}
.ptog > span .icon{margin-left:auto;visibility:hidden}
.ptog > span > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.ptog input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.ptog input:checked + span .icon{visibility:visible}
[contenteditable="true"]{outline:2px dashed var(--line);outline-offset:4px;border-radius:6px}

.plat-list{list-style:none;margin:0;padding:0}
.plat-list li{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.plat-list .grow b{display:block;font-weight:700}
.plat-list .grow span{font-size:13px;color:var(--moss)}
.bar-prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--lime);transition:width .5s var(--out)}
.plat-compact{list-style:none;margin:0;padding:0}
.plat-compact li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.plat-compact li:first-child{border-top:0}
.plat-compact .grow{flex:1;min-width:0}
.plat-compact .grow b{display:block;font-weight:700;font-size:14px}
.viewlink{font-size:12.5px;font-weight:700;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;white-space:nowrap;flex:none}
.hero{position:relative;height:230px;flex:none}
.hero .ph{width:100%;height:100%;border-radius:0}
.hero .icon-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);z-index:2}
.hero .icon-btn.l{left:16px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg4 i{height:4px;border-radius:2px;background:var(--line)}
.seg4 i.on{background:var(--ink)}
.seg4 span{font-size:12px;color:var(--moss);margin-top:6px}
.seg4 span.cur{color:var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:16px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow-soft)}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:800}
.tile span{font-size:13px;color:var(--moss)}
.now-row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:0 2px;cursor:pointer;text-align:left;margin-top:16px}
.now-row .grow{flex:1;font-weight:600}
.chip-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip-btn{min-height:44px;border-radius:999px;padding:0 16px;background:var(--surface);box-shadow:var(--shadow-soft);cursor:pointer;font-weight:600;border:0}
.actionbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--surface)}
.actionbar .btn{width:auto;padding:0 24px}
.actionbar b{font-size:22px;font-variant-numeric:tabular-nums;font-weight:800}

.group{margin-bottom:24px}
.group-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0 0 10px;text-align:left;cursor:pointer;overflow:visible}
.group-head .ph{width:44px;height:44px}
.group-head .grow{flex:1;min-width:0}
.group-head b{font-weight:700}
.group-head .grow span{display:block;font-size:13px;color:var(--moss)}
.subhead{font-size:12px;color:var(--moss);font-weight:700;margin:2px 0 8px}
.chat-row{display:flex;gap:12px;align-items:center;width:100%;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-soft);padding:12px 14px;text-align:left;cursor:pointer;min-height:74px;margin-bottom:8px;border:0}
.chat-row .grow{flex:1;min-width:0}
.chat-row .top-line{display:flex;align-items:center;gap:6px}
.chat-row .top-line b{font-weight:700}
.chat-row .top-line b.normal{font-weight:600}
.chat-row .last{display:block;font-size:14px;color:var(--moss);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-row.needs .last{color:var(--ink);font-weight:600}
.chat-row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.offer-pill{font-weight:800;border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums;background:var(--limetint)}
.typing{display:inline-flex;gap:3px;align-items:center;margin-right:4px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--moss);animation:tdot 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
details.fold{border-radius:20px;margin-top:8px}
details.fold summary{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;cursor:pointer;font-weight:600;color:var(--moss);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold .inner{padding:4px 0 2px}
details.fold .chat-row{cursor:default;background:var(--page);box-shadow:none}

.item-row{flex:none;display:flex;gap:12px;align-items:center;padding:10px 20px 16px;overflow:visible}
.item-row .ph{width:44px;height:44px}
.item-row .grow{flex:1;min-width:0}
.item-row .btn{flex:none}
.item-row b{font-weight:700}
.item-row .grow span{display:block;font-size:13px;color:var(--moss)}
.thread{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.day{align-self:center;font-size:12px;color:var(--moss);margin:6px 0;font-weight:600}
.msg{max-width:80%;padding:12px 14px;border-radius:18px;font-size:15px}
.msg .who{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--moss);margin-bottom:4px}
.msg.buyer{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow-soft);border-bottom-left-radius:6px}
.msg.agent-m{align-self:flex-end;background:var(--lime);color:var(--ink);border-bottom-right-radius:6px}
.msg.you{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.you .who{color:rgba(255,255,255,.65)}
.offer-card{border-radius:14px;padding:8px 12px;margin:4px 0 8px;background:rgba(255,255,255,.55);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.msg.buyer .offer-card{background:var(--page)}
.offer-card small{font-size:11px;font-weight:700;color:var(--moss)}
.offer-card b{font-size:22px;font-variant-numeric:tabular-nums}
.offer-card.accepted{background:var(--ink);color:#fff}
.offer-card.accepted small{color:rgba(255,255,255,.65)}
.deal{border-radius:20px;padding:14px;margin-top:8px;display:flex;gap:12px;align-items:center;background:var(--limetint)}
.deal b{display:block;font-weight:700}
.cal{width:52px;flex:none;border-radius:12px;text-align:center;padding:6px 0;line-height:1.1;background:var(--surface);box-shadow:var(--shadow-soft)}
.cal b{display:block;font-size:20px;font-weight:800}
.cal small{font-size:10px;font-weight:700;color:var(--moss)}
.composer{flex:none;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.composer .row input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:22px;padding:0 16px;background:var(--surface)}
.qr{display:flex;gap:8px;padding:0 20px 10px;flex-wrap:wrap;background:var(--surface)}
.qrbtn{min-height:40px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;border:0}
.qrbtn.primary{background:var(--ink);color:var(--lime)}
.qrbtn.secondary{background:var(--surface);box-shadow:var(--shadow-soft);color:var(--ink)}

.soldphone{background:var(--ink);color:#fff}
.soldstage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:var(--limetint);overflow:visible;color:var(--ink)}
.soldstage .sticker{width:56%;max-width:210px}
.sold-text{position:absolute;left:0;right:0;top:14%;text-align:center;padding:0 24px;opacity:0;transition:opacity .5s var(--out)}
.sold-text.show{opacity:1}
.sold-text .big{font-size:30px;font-weight:800;line-height:1.15}
.next-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .6s var(--spring);box-shadow:var(--shadow-float);max-height:70%;overflow-y:auto}
.next-panel.show{transform:translateY(0)}
.recap div{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 2px}
.recap div b{font-variant-numeric:tabular-nums;font-weight:700}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rchips > span{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;background:var(--page);font-weight:600}
.rchips .icon{width:14px;height:14px;stroke-width:2.6}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;padding:8px 0;position:relative}
.timeline li::before{content:"";width:18px;height:18px;flex:none;border-radius:50%;background:var(--line);margin-top:2px}
.timeline li.done::before{background:var(--ink)}
.timeline li b{display:block;font-weight:700}
.timeline li span{font-size:14px;color:var(--moss)}
.poof-fx{position:absolute;z-index:9;pointer-events:none;background:url(assets/poof-sprite.webp) 0 0/2600% 100% no-repeat;animation:sprite .867s steps(25) forwards;transition:transform .35s var(--out),opacity .35s var(--out)}
.poof-fx.out{transform:scale(.4) translateY(-20px);opacity:0}
@keyframes sprite{to{background-position:100% 0}}

.home-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.home-head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.grid-ads{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:32px 16px}
.gtile{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.gtile .ph{width:100%;aspect-ratio:1;border-radius:0;background:none;overflow:visible}
.gtile .ph img{object-fit:contain}
.gtile span.t{display:block;margin-top:10px;font-weight:700;line-height:1.3;font-size:14px}
.tile-status{display:block;margin-top:4px}

/* ---------- app shell ---------- */
#app-shell{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--page)}
#phone-wrap{position:relative;width:100%;height:100dvh}
#phone{position:relative;width:100%;height:100%;background:var(--page);overflow:hidden;display:block}
#restart{display:none;margin-top:14px;background:none;border:0;color:var(--moss);font:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;padding:6px}
@media (min-width:560px){
  #app-shell{padding:40px 16px}
  #phone-wrap{width:390px;height:844px;flex:none}
  #phone{border-radius:44px;border:1px solid var(--line);box-shadow:var(--shadow-float)}
  #restart{display:inline-flex}
}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page)}
.top2{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 8px;min-height:64px}
.body2{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 24px}
.foot2{flex:none;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.hint2{font-size:13px;color:var(--moss);text-align:center}

#banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;background:var(--ink);color:#fff;border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:none;transform:translateY(-160%);transition:transform .5s var(--spring),box-shadow .35s;cursor:pointer}
#banner.show{transform:translateY(0);box-shadow:var(--shadow-float)}
#banner .btxt b{display:block;font-weight:700;font-size:14px;line-height:1.3}
#banner .btxt small{color:rgba(255,255,255,.65);font-size:11px}

#presenter:empty{display:none}
.psheet-backdrop{position:absolute;inset:0;background:rgba(15,42,24,.4);z-index:70}
.psheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 22px);box-shadow:var(--shadow-float);z-index:71}
.psheet h2{margin:0 0 14px;font-size:16px;font-weight:800}
.psheet .btn{margin-bottom:10px}
.psheet .btn:last-child{margin-bottom:0}
.psheet .hint{margin:-4px 0 10px;font-size:12px;color:var(--moss)}

/* sell flow: full-screen bottom sheet */
.sheet-backdrop{position:absolute;inset:0;background:rgba(15,42,24,.4);z-index:39;opacity:0;pointer-events:none;transition:opacity .32s var(--out)}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sell-sheet{position:absolute;inset:0;background:var(--page);border-radius:0;z-index:40;transform:translateY(100%);transition:transform .38s var(--spring);box-shadow:var(--shadow-float);display:flex;flex-direction:column;overflow:hidden}
.sell-sheet.show{transform:translateY(0)}

/* demo item picker, fix list, sold overview */
.itempick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.itempick button{min-height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--page);font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.itempick button.on{background:var(--ink);color:var(--lime)}
.fixsheet{margin:14px 0 4px}
.fixopt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 12px;margin-bottom:6px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-soft);font:inherit;font-weight:700;color:var(--ink);text-align:left;cursor:pointer}
.fixopt .sticker{width:40px;height:40px;flex:none}
.fixopt.on{box-shadow:0 0 0 2px var(--ink)}
.fixopt .icon{width:18px;height:18px}
.soldbadge{position:absolute;left:16px;bottom:14px;z-index:2;background:var(--lime);color:var(--ink);font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;transform:rotate(-3deg);box-shadow:var(--shadow-soft)}
.soldcard{background:var(--surface);box-shadow:var(--shadow-soft)}
.soldcard .recap > div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px}
.soldcard .recap > div span{color:var(--moss)}

/* go-live moment */
.golive{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;cursor:pointer}
.golive-hero{position:relative;width:220px;height:220px;flex:none}
.golive-hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:20px}
.golive-hero .sticker-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(15,42,24,.12))}
.golive-head{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:22px 0 0;min-height:28px}
.golive-plats{position:relative;display:flex;gap:16px;margin-top:30px}
.golive .hint{font-size:12px;color:var(--moss);margin-top:24px}
.gplat{display:flex;flex-direction:column;align-items:center;gap:6px}
.gplat .wrap{position:relative;width:56px;height:56px;display:grid;place-items:center}
.gplat .ring{position:absolute;inset:0;transform:rotate(-90deg)}
.gplat .ring circle{fill:none;stroke:var(--line);stroke-width:3}
.gplat .ring circle.fg{stroke:var(--ink);stroke-dasharray:150.8;stroke-dashoffset:150.8;transition:stroke-dashoffset .5s var(--out)}
.gplat .check{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .25s var(--out),transform .25s var(--spring)}
.gplat .check.show{opacity:1;transform:scale(1)}
.gplat .check .icon{width:12px;height:12px;stroke-width:3}
.gplat .lbl{font-size:11px;color:var(--moss);font-weight:600}
.gplat .lbl.live{color:var(--ink);font-weight:700}
.gplat .st{font-size:11px;font-weight:700;color:#3F7A1F;line-height:1;opacity:0;transform:translateY(-4px);transition:opacity .25s var(--out),transform .25s var(--spring)}
.gplat .st.show{opacity:1;transform:none}
.gfly{position:absolute;z-index:5;pointer-events:none;width:84px;height:84px}
.gfly img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(15,42,24,.18))}

/* micro-animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes msgPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes qrUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pricePulse{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes tagDrop{0%{opacity:0;transform:translateY(-14px) rotate(var(--tilt,4deg)) scale(.8)}60%{opacity:1;transform:translateY(3px) rotate(var(--tilt,4deg)) scale(1.04)}100%{opacity:1;transform:translateY(0) rotate(var(--tilt,4deg)) scale(1)}}
.price-big.pulse{animation:pricePulse .26s var(--out)}
.btn,.chip-btn,.qrbtn,.gtile,.chat-row,.group-head,.now-row,#tabbar .tab,.rchip span,.ptog>span,.icon-btn,.homeseg button,.tabs button,.viewlink,.chip,.thumbs button,.cover,.shutter{transition:transform .3s var(--spring)}
.btn:active,.chip-btn:active,.qrbtn:active,.gtile:active,.chat-row:active,.group-head:active,.now-row:active,#tabbar .tab:active,.rchip span:active,.ptog>span:active,.icon-btn:active,.homeseg button:active,.tabs button:active,.viewlink:active,.chip:active,.thumbs button:active,.cover:active,.shutter:not(:disabled):active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>

<div id="app-shell">
  <div id="phone-wrap">
    <div id="phone">
      <div id="stage"></div>
      <div id="banner" role="status" aria-live="polite"></div>

  const sheetStageEl = document.getElementById('sellStage');
  const sellSheetEl = document.getElementById('sellSheet');
  const sellBackdropEl = document.getElementById('sellBackdrop');
  let stack = [{ id: 'home', params: {} }];
  let currentLayer = null, currentId = null;

  const SCREENS = {
    home: renderHome, chats: renderChats,
    'sell-snap': renderSnap, 'sell-isit': renderIsIt,
    'sell-min': renderMin, 'sell-handover': renderHandover, 'sell-working': renderWorking,
    'sell-ad': renderAd, 'sell-golive': renderGoLive, product: renderProduct,
    'chat-mila': renderChatMila, 'chat-tom': renderChatTom, 'chat-noor': renderChatNoor, sold: renderSold
  };

  function go(id, params, opts) {
    opts = opts || {};
    params = params || {};
    let mode = opts.mode || (ROOTS.includes(id) ? 'tab' : 'push');
    let dir;
    if (mode === 'replace') { stack[stack.length - 1] = { id, params }; dir = 'fwd'; history.replaceState({ d: stack.length }, '', '#' + id); }
    else if (mode === 'tab') { stack = [{ id, params }]; dir = 'tab'; history.pushState({ d: 1 }, '', '#' + id); }
    else { stack.push({ id, params }); dir = 'fwd'; history.pushState({ d: stack.length }, '', '#' + id); }
    render(id, params, dir);
  }
  function navBack() { if (stack.length > 1) history.back(); }
  window.addEventListener('popstate', () => {
    if (stack.length > 1) {
      stack.pop();
      // Steps of a finished sell flow are skipped: back from the live ad goes home, never into the old sheet.
      while (stack.length > 1 && stack[stack.length - 1].done) stack.pop();
      const top = stack[stack.length - 1];
      history.replaceState({ d: stack.length }, '', '#' + top.id);
      render(top.id, top.params, 'back');
    }
  });

  let sheetClearTimer = null;
  function openSheet() { clearTimeout(sheetClearTimer); sellSheetEl.classList.add('show'); sellBackdropEl.classList.add('show'); }
  function closeSheet() {
    sellSheetEl.classList.remove('show'); sellBackdropEl.classList.remove('show');
    stopCamera();
    clearTimeout(sheetClearTimer);
    sheetClearTimer = setTimeout(() => { sheetStageEl.innerHTML = ''; }, reduceMotion ? 0 : 460);
  }

  function render(id, params, dir) {
    if (currentId === 'sell-snap' && id !== 'sell-snap') stopCamera();
    if (currentId === 'sell-golive' && id !== 'sell-golive' && goliveActive) stopGoLive();
    const isSheet = SHEET_SCREENS.has(id);
    const wasSheet = SHEET_SCREENS.has(currentId);

    if (isSheet && !wasSheet) {
      // opening the sheet fresh, over whatever is currently showing
      const layer = document.createElement('div');
      layer.className = 'layer';
      layer.innerHTML = SCREENS[id](params || {});
      clearTimeout(sheetClearTimer);
      sheetStageEl.innerHTML = '';
      sheetStageEl.appendChild(layer);
      if (reduceMotion) openSheet();
      else requestAnimationFrame(openSheet);
      currentLayer = layer; currentId = id;
      updateTabbar(id);
      afterMount(id);
      return;
    }
    if (!isSheet && wasSheet) {
      // closing the sheet: push the destination screen behind it, then slide the sheet down to reveal it
      const layer = document.createElement('div');
      layer.className = 'layer';
      layer.innerHTML = SCREENS[id](params || {});
      stageEl.appendChild(layer);
      [...stageEl.children].forEach(c => { if (c !== layer) c.remove(); });
      closeSheet();
      currentLayer = layer; currentId = id;
      updateTabbar(id);
      afterMount(id);
      return;
    }

    const container = isSheet ? sheetStageEl : stageEl;
    const layer = document.createElement('div');
    layer.className = 'layer';
    layer.innerHTML = SCREENS[id](params || {});
    if (dir === 'back') container.insertBefore(layer, currentLayer);
    else container.appendChild(layer);
    const old = currentLayer;
    if (reduceMotion) {
      layer.style.transform = 'none'; layer.style.opacity = '1';
      if (old) old.remove();
    } else {
      requestAnimationFrame(() => {
        if (dir === 'fwd') {
          layer.style.transform = 'translateX(100%)';
          requestAnimationFrame(() => {
            layer.style.transition = 'transform .32s var(--out)';
            layer.style.transform = 'translateX(0)';
            if (old) { old.style.transition = 'transform .32s var(--out), filter .32s var(--out)'; old.style.transform = 'translateX(-25%)'; old.style.filter = 'brightness(.9)'; }
          });
        } else if (dir === 'back') {
          layer.style.transform = 'translateX(-25%)'; layer.style.filter = 'brightness(.9)';
          requestAnimationFrame(() => {
            layer.style.transition = 'transform .32s var(--out), filter .32s var(--out)';
            layer.style.transform = 'translateX(0)'; layer.style.filter = 'none';
            if (old) { old.style.transition = 'transform .32s var(--out)'; old.style.transform = 'translateX(100%)'; }
          });
        } else {
          layer.style.opacity = '0';
          requestAnimationFrame(() => { layer.style.transition = 'opacity .18s var(--out)'; layer.style.opacity = '1'; });
        }
      });
      setTimeout(() => { if (old && old.parentNode) old.remove(); }, dir === 'tab' ? 220 : 380);
    }
    currentLayer = layer; currentId = id;
    updateTabbar(id);
    afterMount(id);
  }

  function refreshInPlace(id) {
    if (currentId !== id || !currentLayer) return;
    const top = stack[stack.length - 1];
    // Keep the scroll position and the step bar when content updates underneath the user.
    const oldScroll = currentLayer.querySelector('.body2');
    const y = oldScroll ? oldScroll.scrollTop : 0;
    const atBottom = oldScroll ? oldScroll.scrollHeight - y - oldScroll.clientHeight < 48 : false;
    currentLayer.innerHTML = SCREENS[id](top.params || {});
    const newScroll = currentLayer.querySelector('.body2');
    // Chats follow new messages when you were already at the bottom.
    if (newScroll && id.indexOf('chat-') === 0 && atBottom) newScroll.scrollTop = newScroll.scrollHeight;
    else if (newScroll && y) newScroll.scrollTop = y;
    currentLayer.querySelectorAll('.wizbar i[data-w]').forEach(i => { i.style.transition = 'none'; i.style.width = i.dataset.w + '%'; });
    if (id === 'sell-snap') attachCamera();
  }

  function positionTabIndicator(id) {
    const ind = document.getElementById('tabIndicator');
    if (!ind) return;
    const target = id === 'chats' ? 'chats' : 'home';
    const btn = tabbarEl.querySelector('.tab[data-tab="' + target + '"]');
    if (!btn) return;
    const tRect = tabbarEl.getBoundingClientRect();
    const bRect = btn.getBoundingClientRect();
    ind.style.width = bRect.width + 'px';
    ind.style.transform = 'translateX(' + (bRect.left - tRect.left) + 'px)';
  }

  function updateTabbar(id) {
    const isRoot = ROOTS.includes(id);
    tabbarEl.style.display = isRoot ? 'flex' : 'none';
    tabbarEl.querySelectorAll('.tab[data-tab]').forEach(b => { if (b.dataset.tab === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    const need = needsYouCount();
    chatBadgeEl.hidden = need <= 0;
    chatBadgeEl.textContent = need;
    if (isRoot) positionTabIndicator(id);
  }

  function afterMount(id) {
    const wb = currentLayer && currentLayer.querySelector('.wizbar i[data-w]');
    if (wb) { if (reduceMotion) wb.style.width = wb.dataset.w + '%'; else requestAnimationFrame(() => { wb.style.width = wb.dataset.w + '%'; }); }
    if (id === 'sell-working') runWorkingSteps();
    if (id === 'sell-golive') { S.uploading = true; runGoLiveSequence(); }
    if (id === 'sell-snap') {
      if (camStream) attachCamera();
      else if (!S.camFallback) startCamera().then(() => { if (currentId === 'sell-snap') refreshInPlace('sell-snap'); });
    }
    if (id === 'chat-mila') {
      if (!S.milaPlayed) { S.milaPlayed = true; playMila(); }
      startSoldCountdown();
    }
    if (id === 'sold') { if (S.soldRevealed) showSoldSettled(); else playSoldReveal(); }
    if (id === 'chats' && S.tomOfferArrived) S.viewedNegotiating = true;
  }

  /* ---------- delegated events ---------- */
  phoneEl.addEventListener('click', e => {
    const title = e.target.closest('#homeTitle');
    if (title) { handleTripleTap(); return; }
    const back = e.target.closest('[data-back]');
    if (back) { navBack(); return; }
    const goEl = e.target.closest('[data-go]');
    if (goEl) {
      const mode = goEl.dataset.mode;
      go(goEl.dataset.go, {}, mode ? { mode } : {});
      return;
    }
    const act = e.target.closest('[data-act]');
    if (act) { handleAction(act.dataset.act, act); return; }
  });
  phoneEl.addEventListener('change', e => {
    if (e.target && e.target.id === 'galleryInput') { handleGalleryFiles(e.target.files); return; }
    const act = e.target.closest('[data-actchange]');
    if (act) handleAction(act.dataset.actchange, act);
  });
  tabbarEl.addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    if (b.dataset.tab === 'sell') { go('sell-snap', {}, { mode: 'push' }); return; }
    if (b.dataset.tab === 'profile') { showBanner('Profile is not part of the demo'); return; }
    go(b.dataset.tab, {}, { mode: 'tab' });
  });
  bannerEl.addEventListener('click', () => { if (bannerEl._onTap) bannerEl._onTap(); hideBanner(); });

  let bannerTimer = null;
  function showBanner(text, onTap, persist) {
    clearTimeout(bannerTimer);
    bannerEl.innerHTML = APP_ICON(38) + '<span class="btxt"><small>poof</small><b></b></span>';
    bannerEl.querySelector('b').textContent = text;
    bannerEl._onTap = onTap;
    bannerEl.classList.add('show');
    if (!persist) bannerTimer = setTimeout(hideBanner, 9000);
  }
  function hideBanner() { bannerEl.classList.remove('show'); }

  function handleAction(act, el) {
    switch (act) {
      case 'shutter': {
        if (S.photos.length >= 5) break;
        const layer = currentLayer;
        const video = layer && layer.querySelector('#camVideo');
        let captured;
        if (!S.camFallback && camStream && video && video.videoWidth) {
          try { captured = drawToCanvas(video, video.videoWidth, video.videoHeight); }
          catch (e) { captured = nextDemoPhoto(); }
        } else {
          captured = nextDemoPhoto();
        }
        flashOnce();
        setTimeout(() => { S.photos.push(captured); refreshInPlace('sell-snap'); }, 150);
        break;
      }
      case 'photo-remove': {
        const i = +el.dataset.i;
        if (!isNaN(i)) S.photos.splice(i, 1);
        if (S.cover >= S.photos.length) S.cover = Math.max(0, S.photos.length - 1);
        refreshInPlace('sell-snap');
        break;
      }
      case 'gallery-open': { const inp = currentLayer && currentLayer.querySelector('#galleryInput'); if (inp) inp.click(); break; }
      case 'cam-retry': startCamera().then(() => refreshInPlace('sell-snap')); break;
      case 'cover-set': S.cover = +el.dataset.i; S.coverTouched = true; refreshInPlace(currentId); break;
      case 'cond-set': S.cond = +el.dataset.i; refreshInPlace(currentId); break;
      case 'cond-cycle': S.cond = (S.cond + 1) % COND.length; refreshInPlace(currentId); break;
      case 'hand-cycle': S.hand = (S.hand + 1) % 3; refreshInPlace(currentId); break;
      case 'speed-set': {
        S.when = +el.dataset.i;
        if (SPEED_INFO[S.when]) S.goal = Math.max(S.min + IT().step, S.when === 0 ? IT().fast : IT().best);
        refreshInPlace(currentId); pulsePrices();
        break;
      }
      case 'min-minus': S.min = Math.max(5, S.min - IT().step); if (S.goal <= S.min) S.goal = S.min + IT().step; refreshInPlace(currentId); pulsePrices(); break;
      case 'min-plus': S.min = Math.min(995, S.min + IT().step); if (S.goal <= S.min) S.goal = S.min + IT().step; refreshInPlace(currentId); pulsePrices(); break;
      case 'goal-minus': S.goal = Math.max(S.min + IT().step, S.goal - IT().step); refreshInPlace(currentId); pulsePrices(); break;
      case 'goal-plus': S.goal = Math.min(1999, S.goal + IT().step); refreshInPlace(currentId); pulsePrices(); break;
      case 'hand-set': S.hand = +el.dataset.i; refreshInPlace(currentId); break;
      case 'home-tab': S.homeTab = el.dataset.v; refreshInPlace('home'); break;
      case 'edit-toggle': S.editingAd = !S.editingAd; refreshInPlace('sell-ad'); break;
      case 'approve':
        S.created = true;
        go('sell-golive', {}, { mode: 'push' });
        break;
      case 'golive-skip': skipGoLive(); break;
      case 'pause-toggle': S.paused = !S.paused; refreshInPlace('product'); showBanner(S.paused ? 'Ad paused' : 'Ad live again'); break;
      case 'open-chats': go('chats', {}, { mode: 'tab' }); break;
      case 'takeover-toggle': S.takeover = !S.takeover; refreshInPlace('chat-mila'); break;
      case 'mila-send': {
        const inp = currentLayer.querySelector('#milaInput');
        if (inp && inp.value.trim()) { S.milaYouMsgs = (S.milaYouMsgs || []).concat(inp.value.trim()); refreshInPlace('chat-mila'); popLastMessage(); }
        break;
      }
      case 'tom-counter': resolveTom('counter'); break;
      case 'tom-accept': resolveTom('accept'); break;
      case 'tom-decline': resolveTom('decline'); break;
      case 'tom-send': {
        const inp = currentLayer.querySelector('#tomInput');
        if (inp && inp.value.trim()) { S.tomYouMsgs = (S.tomYouMsgs || []).concat(inp.value.trim()); refreshInPlace('chat-tom'); popLastMessage(); }
        break;
      }
      case 'sell-else': {
        Object.assign(S, freshWizard());
        go('sell-snap', {}, { mode: 'push' });
        break;
      }
      case 'mark-handover-done': {
        S.handoverDone = true;
        refreshInPlace('sold'); showSoldSettled();
        refreshInPlace('product'); refreshInPlace('home');
        showBanner('Marked as done · moved to Sold');
        S.homeTab = 'sold';
        break;
      }
      case 'presenter-tom': fireTomOffer(); closePresenter(); break;
      case 'presenter-deal': soldEvent(); closePresenter(); break;
      case 'presenter-skip': closePresenter(); skipAheadDays(); break;
      case 'presenter-restart': closePresenter(); restart(); break;
      case 'presenter-samples': closePresenter(); S.photos = demoPhotos().slice(); S.coverTouched = false; go('sell-snap', {}, { mode: 'push' }); break;
      case 'presenter-close': closePresenter(); break;
      case 'fix-toggle': S.fixOpen = !S.fixOpen; refreshInPlace(currentId); if (S.fixOpen) { const fl = currentLayer && currentLayer.querySelector('#fixList'); if (fl) fl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' }); } break;
      case 'item-pick': {
        setItem(el.dataset.k);
        Object.assign(S, { min: IT().min, goal: IT().goal, cond: IT().cond, when: 2, fixOpen: false, coverTouched: false });
        refreshInPlace(currentId);
        break;
      }
      case 'presenter-item': {
        setItem(el.dataset.k);
        restart();
        showBanner('Demo item: ' + IT().title);
        break;
      }
      case 'sheet-backdrop': navBack(); break;
      case 'change-goal': showBanner("Change goal isn't part of the demo"); break;
      case 'take-offline': showBanner("Taking your ad offline isn't part of the demo"); break;
      case 'plat-view': showBanner('Opens your listing on ' + PLATFORMS[el.dataset.k].name); break;
    }
  }

  /* ---------- sell flow: snap it ---------- */
  const SLOT_NAMES = ['Front', 'Back', 'Side', 'Detail', 'Label'];
  function renderSnap() {
    const n = S.photos.length;
    const slots = SLOT_NAMES.map((name, i) => {
      const filled = i < n, next = i === n;
      const cls = 'slot' + (filled ? ' filled' : next ? ' next' : '');
      const inner = filled
        ? '<img src="' + photoAt(i) + '" alt=""><span class="x" data-act="photo-remove" data-i="' + i + '"><svg class="icon"><use href="#i-close"/></svg></span>'
        : '<svg class="icon"><use href="#i-plus"/></svg>';
      return '<button type="button" class="' + cls + '" ' + (filled ? 'data-act="photo-remove" data-i="' + i + '"' : '') + ' aria-label="' + name + (filled ? ' photo, tap to remove' : ', empty') + '"><span class="box">' + inner + '</span><span>' + name + '</span></button>';
    }).join('');
    const viewfinderInner = S.camFallback
      ? '<img src="' + nextDemoPhoto() + '" alt="Sample photo of your ' + IT().short + '">'
      : '<video id="camVideo" playsinline muted autoplay></video>';
    const notReady = !S.camFallback && !camReady;
    const shutterDisabled = n >= 5 || notReady;
    const pill = S.camFallback ? '<p class="pill quiet">Camera off, using a sample photo</p>'
      : notReady ? '<p class="pill quiet">Starting camera…</p>' : '';
    return `
      <div class="top2 cam">
        <button class="icon-btn" type="button" aria-label="Close" data-back>${ic('close')}</button>
        <h1 class="bar-title" style="flex:1;text-align:center">Sell something</h1>
        <button class="icon-btn" type="button" aria-label="Flash">${ic('flash')}</button>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;min-height:0;padding:0 20px">
        <div class="viewfinder" style="flex:1">
          ${viewfinderInner}
          <div class="vf-scrim" aria-hidden="true"></div>
          <div class="flash-overlay" id="camFlash" aria-hidden="true"></div>
          ${pill}
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
          ${S.camDenied ? '<button class="btn secondary" type="button" data-act="cam-retry" style="position:absolute;left:12px;right:12px;bottom:12px;z-index:2">Allow camera</button>' : ''}
        </div>
        <div class="slots">${slots}</div>
        <p class="cam-count">${n} of 5 photos${n ? ' · one is enough' : ''}</p>
      </div>
      <div class="cam-controls" style="padding:10px 24px 24px">
        <button class="icon-btn" type="button" aria-label="Pick from gallery" data-act="gallery-open">${ic('gallery')}</button>
        <input type="file" id="galleryInput" accept="image/*" multiple hidden>
        <button class="shutter" type="button" data-act="shutter" ${shutterDisabled ? 'disabled' : ''} aria-label="Take photo"></button>
        <button class="btn small" type="button" ${n === 0 ? 'disabled' : ''} data-go="sell-isit">Done</button>
      </div>`;
  }

  /* ---------- is this it ---------- */
  const COND = [
    { label: 'New', help: 'Never used, still in the box or with tags.' },
    { label: 'Like new', help: 'Used a few times, no visible marks.' },
    { label: 'Good', help: 'Normal signs of use, everything works.' },
    { label: 'Used', help: 'Clear marks or wear, still works.' }
  ];
  function renderIsIt() {
    coverPhoto(); // settle Poof's cover pick before drawing the thumbnails
    const n = Math.max(1, S.photos.length);
    const thumbs = Array.from({ length: n }, (_, i) => '<button type="button" data-act="cover-set" data-i="' + i + '" aria-pressed="' + (S.cover === i) + '" aria-label="Photo ' + (i + 1) + '"><span class="ph"><img src="' + photoAt(i) + '" alt=""></span></button>').join('');
    const chips = COND.map((c, i) => '<label class="rchip"><input type="radio" name="cond" data-actchange="cond-set" data-i="' + i + '" ' + (S.cond === i ? 'checked' : '') + '><span>' + c.label + '</span></label>').join('');
    return `
      <div class="top2"><button class="icon-btn" type="button" aria-label="Back" data-back>${ic('back')}</button>
        <div class="wizbar" aria-hidden="true"><i data-w="33" style="width:0"></i></div><span class="step-count">1 of 3</span>
      </div>
      <div class="body2">
        <h1 class="q">Is this it?</h1>
        <p class="sub">Poof recognised it from your photos.</p>
        <button class="cover" type="button" aria-label="Cover photo"><span class="ph"><img src="${coverPhoto()}" alt="${IT().short}, cover photo"><span class="ph-note">Picked by Poof</span></span></button>
        <div class="thumbs">${thumbs}</div>
        <div class="recog">
          <p class="eyebrow">What it is</p>
          <h2>${IT().title}</h2>
          <p class="muted">${IT().sub} · ${COND[S.cond].label}</p>
        </div>
        ${S.fixOpen ? '<div class="fixsheet" id="fixList"><p class="sec" style="margin:0 0 8px">What is it?</p>' + ITEM_ORDER.map(k => '<button type="button" class="fixopt' + (k === itemKey ? ' on' : '') + '" data-act="item-pick" data-k="' + k + '">' + sticker(ITEMS[k].cutout, 0) + '<span class="grow">' + ITEMS[k].title + '</span>' + (k === itemKey ? ic('check') : '') + '</button>').join('') + '</div>' : ''}
        <p class="sec">Condition</p>
        <div class="chips" role="radiogroup" aria-label="Condition">${chips}</div>
        <p class="helper">${COND[S.cond].help}</p>
        <p class="sec">Details</p>
        <dl class="dl card divided" style="box-shadow:var(--shadow-soft)">
          ${IT().details.map(d => '<div><dt>' + d[0] + '</dt><dd>' + d[1] + '</dd><button class="icon-btn plain" type="button" aria-label="Edit ' + d[0].toLowerCase() + '">' + ic('edit') + '</button></div>').join('')}
        </dl>
      </div>
      <div class="foot2">
        <button class="btn" type="button" data-go="sell-min">Yes, that's it<svg class="icon cta-ic" aria-hidden="true"><use href="#i-cta-arrow"/></svg></button>
        <button class="btn ghost" type="button" data-act="fix-toggle">${S.fixOpen ? 'Close' : 'Fix it'}</button>
      </div>`;
  }

  /* ---------- minimum + goal (speed choice lives here too, one screen fewer) ---------- */
  const SPEED_INFO = {
    0: { label: 'Sell fast', line: 'Gone in about 3 days, for a slightly lower price' },
    2: { label: 'Best price', line: 'Gone in 2 weeks or more, holding out for the best price' }
  };
  function renderMin() {
    const HISTO_MIN = IT().histo[0], HISTO_MAX = IT().histo[1], HISTO_TYPICAL = IT().histo[2];
    const HISTO_COUNTS = IT().counts, peak = Math.max.apply(null, HISTO_COUNTS);
    const range = HISTO_MAX - HISTO_MIN;
    const bars = HISTO_COUNTS.map((c, i) => {
      const boundary = HISTO_MIN + (i + 1) * range / HISTO_COUNTS.length;
      const below = boundary <= S.min;
      return '<i style="height:' + (c / peak * 100) + '%" class="' + (below ? 'below' : '') + '"></i>';
    }).join('');
    const minPct = Math.max(0, Math.min(100, (S.min - HISTO_MIN) / range * 100));
    const goalPct = Math.max(0, Math.min(100, (S.goal - HISTO_MIN) / range * 100));
    const speedTabs = [0, 2].map(v => '<button type="button" role="tab" aria-selected="' + (S.when === v) + '" data-act="speed-set" data-i="' + v + '">' + SPEED_INFO[v].label + '</button>').join('');
    return `
      <div class="top2"><button class="icon-btn" type="button" aria-label="Back" data-back>${ic('back')}</button>
        <div class="wizbar" aria-hidden="true"><i data-w="66" style="width:0"></i></div><span class="step-count">2 of 3</span>
      </div>
      <div class="body2">
        <div class="context">${sticker(IT().cutout, 2)}<div class="info"><b>${IT().short}</b><span>· ${SPEED_INFO[S.when].label}</span></div></div>
        <h1 class="q">What's your minimum?</h1>
        <p class="sub">The lowest price you'd still be happy with.</p>
        <div class="stepper card">
          <button class="icon-btn" type="button" data-act="min-minus" aria-label="Lower by ${IT().step} euro">${ic('minus')}</button>
          <output class="price-big">€${S.min}</output>
          <button class="icon-btn" type="button" data-act="min-plus" aria-label="Raise by ${IT().step} euro">${ic('plus')}</button>
        </div>
        <p class="sec">${IT().listings} similar listings sold for €${HISTO_MIN} to €${HISTO_MAX}</p>
        <div class="histo">
          <div class="marker" style="left:${minPct}%"><span>Min</span></div>
          <div class="marker goal" style="left:${goalPct}%"><span>Goal</span></div>
          ${bars}
        </div>

  function runGoLiveSequence() {
    stopGoLive();
    goliveActive = true;
    const layer = currentLayer;
    if (!layer) { finishGoLive(false); return; }
    if (reduceMotion) runGoLiveReduced(layer); else runGoLiveFull(layer);
  }
  function runGoLiveReduced(layer) {
    const photoEl = layer.querySelector('#glPhoto');
    const stickerEl = layer.querySelector('#glSticker');
    const heading = layer.querySelector('#glHeading');
    const plats = [...layer.querySelectorAll('.gplat')];
    goT(300, () => {
      if (photoEl) photoEl.style.opacity = '0';
      if (stickerEl) stickerEl.style.opacity = '1';
    });
    goT(750, () => {
      plats.forEach(p => {
        const fg = p.querySelector('.fg'); if (fg) fg.style.strokeDashoffset = '0';
        const check = p.querySelector('.check'); if (check) check.classList.add('show');
        const lbl = p.querySelector('.lbl'); if (lbl) lbl.classList.add('live'); const st = p.querySelector('.st'); if (st) st.classList.add('show');
      });
      if (heading) heading.innerHTML = '<span class="pb">Live</span> on 4 platforms';
    });
    goT(1250, () => { stopGoLive(); finishGoLive(false); });
  }
  function runGoLiveFull(layer) {
    const root = layer.querySelector('#glRoot');
    const heroBox = layer.querySelector('#glHero');
    const photoEl = layer.querySelector('#glPhoto');
    const stickerEl = layer.querySelector('#glSticker');
    const heading = layer.querySelector('#glHeading');
    if (!root || !heroBox || !photoEl || !stickerEl) { finishGoLive(false); return; }
    const plats = PLATFORM_ORDER.map(k => ({ key: k, el: layer.querySelector('.gplat[data-plat="' + k + '"]') }));

    function flyOne(p) {
      if (!p.el) return;
      const cRect = root.getBoundingClientRect();
      const hRect = heroBox.getBoundingClientRect();
      const wrapEl = p.el.querySelector('.wrap');
      const iRect = wrapEl.getBoundingClientRect();
      const startX = hRect.left + hRect.width / 2 - cRect.left;
      const startY = hRect.top + hRect.height / 2 - cRect.top;
      const endX = iRect.left + iRect.width / 2 - cRect.left;
      const endY = iRect.top + iRect.height / 2 - cRect.top;
      const fly = document.createElement('span');
      fly.className = 'gfly';
      fly.innerHTML = '<img src="assets/' + IT().cutout + '" alt="">';
      fly.style.left = (startX - 42) + 'px';
      fly.style.top = (startY - 42) + 'px';
      root.appendChild(fly);
      const dx = endX - startX, dy = endY - startY;
      const anim = fly.animate([
        { transform: 'translate(0,0) scale(.3)', opacity: 0 },
        { transform: 'translate(0,-10px) scale(1.1)', opacity: 1, offset: .18 },
        { transform: 'translate(' + (dx * .5) + 'px,' + (dy * .5 - 48) + 'px) scale(.9) rotate(-8deg)', opacity: 1, offset: .6 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.45) rotate(0deg)', opacity: 0, offset: 1 }
      ], { duration: 620, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
      goliveAnims.push(anim);
      const fg = p.el.querySelector('.fg');
      if (fg) fg.style.strokeDashoffset = '0';
      anim.addEventListener('finish', () => {
        fly.remove();
        goT(150, () => {
          const check = p.el.querySelector('.check'); if (check) check.classList.add('show');
          const lbl = p.el.querySelector('.lbl'); if (lbl) lbl.classList.add('live'); const st = p.el.querySelector('.st'); if (st) st.classList.add('show');
          const bump = wrapEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.14)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'cubic-bezier(.3,1.4,.5,1)' });
          goliveAnims.push(bump);
        });
      });
    }
    function morphHeadline() {
      if (!heading) return;
      heading.style.transition = 'opacity .2s var(--out)';
      heading.style.opacity = '0';
      goT(200, () => { heading.innerHTML = '<span class="pb">Live</span> on 4 platforms'; heading.style.opacity = '1'; });
    }
    function platformsPhase() {
      plats.forEach((p, i) => goT(i * 450, () => flyOne(p)));
      const lastStart = (plats.length - 1) * 450;
      goT(lastStart + 820, () => {
        morphHeadline();
        goT(500, () => {
          // Small celebratory pop; the poof sprite stays reserved for "sold" (gone).
          const pop = heroBox.animate([
            { transform: 'rotate(-3deg) scale(1)' },
            { transform: 'rotate(-3deg) scale(1.07)' },
            { transform: 'rotate(-3deg) scale(1)' }
          ], { duration: 360, easing: SPRING_JS });
          goliveAnims.push(pop);
          goT(450, () => { stopGoLive(); finishGoLive(true); });
        });
      });
    }

    photoEl.style.transition = 'opacity .55s var(--out)';
    stickerEl.style.transition = 'opacity .55s var(--out)';
    photoEl.style.opacity = '0';
    stickerEl.style.opacity = '1';
    goT(550, () => {
      const anim = heroBox.animate([
        { transform: 'rotate(0deg) scale(1.04)' },
        { transform: 'rotate(-3deg) scale(1)' }
      ], { duration: 420, easing: SPRING_JS, fill: 'forwards' });
      goliveAnims.push(anim);
      goT(420, platformsPhase);
    });
  }
  function createFlipClone(heroBox) {
    const startRect = heroBox.getBoundingClientRect();
    const clone = document.createElement('div');
    clone.className = 'goliveClone';
    clone.style.cssText = 'position:absolute;z-index:75;left:0;top:0;width:100%;height:230px;overflow:hidden;pointer-events:none';
    clone.innerHTML = '<img src="assets/' + IT().cutout + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity .42s var(--out)">' +
      '<img src="' + coverPhoto() + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .42s var(--out)">';
    phoneEl.appendChild(clone);
    const targetRect = clone.getBoundingClientRect();
    // Uniform scale keeps the sticker undistorted; match the hero's height.
    const sy = targetRect.height ? startRect.height / targetRect.height : 1;
    const sx = sy;
    const tx = (startRect.left + startRect.width / 2) - (targetRect.left + targetRect.width / 2);
    const ty = (startRect.top + startRect.height / 2) - (targetRect.top + targetRect.height / 2);
    clone.style.transformOrigin = 'center';
    clone.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ') rotate(-3deg)';
    clone.getBoundingClientRect();
    const imgs = clone.querySelectorAll('img');
    requestAnimationFrame(() => {
      clone.style.transition = 'transform .48s var(--spring)';
      clone.style.transform = 'translate(0,0) scale(1,1) rotate(0deg)';
      imgs[0].style.opacity = '0';
      imgs[1].style.opacity = '1';
    });
    setTimeout(() => clone.remove(), 640);
  }
  function finishGoLive(withFlip) {
    goliveActive = false;

  /* ---------- shared: this ad's chat entries (used on both the chats tab and the product page) ---------- */
  function airpodsChatEntries() {
    const entries = [];
    if (S.tomOfferArrived) {
      let tomLast, tomSpoke = true;
      if (!S.tomResolved) { tomLast = 'Would you do €' + tomOffer() + '? I can come tonight.'; tomSpoke = false; }
      else if (S.sold) tomLast = 'Sorry Tom, it just sold. Thanks for your interest!';
      else if (S.tomResolved === 'counter') tomLast = 'I can do €' + S.min + '.';
      else if (S.tomResolved === 'accept') tomLast = 'Deal, thanks!';
      else tomLast = "Sorry, can't go that low. Thanks for the interest!";
      entries.push({
        id: 'tom', go: 'chat-tom', letter: 'T', plat: 'marktplaats', name: 'Tom',
        last: tomLast, poofSpoke: tomSpoke,
        offer: tomOffer(), state: S.tomResolved ? 'handled' : 'needs', unread: !S.tomResolved
      });
    }
    const milaNegotiating = !S.sold && (S.milaTyping || (S.milaStage > 0 && !S.milaDealDone));
    let milaLast, milaSpoke = true;
    if (S.sold) milaLast = milaScript().slice(-1)[0].text;
    else if (milaNegotiating) { milaLast = 'Poof is negotiating'; milaSpoke = false; }
    else if (S.milaStage > 0) milaLast = IT().counterLine;
    else { milaLast = 'No messages yet'; milaSpoke = false; }
    entries.push({
      id: 'mila', go: 'chat-mila', letter: 'M', plat: 'marktplaats', name: 'Mila',
      last: milaLast, poofSpoke: milaSpoke,
      offer: S.sold ? S.soldPrice : milaDeal(), state: milaNegotiating ? 'negotiating' : 'handled', typing: S.milaTyping
    });
    entries.push({
      id: 'noor', go: 'chat-noor', letter: 'N', plat: 'vinted', name: 'Noor',
      last: S.sold ? 'Sorry Noor, it just sold. Thanks for asking!' : IT().noorA, poofSpoke: true,
      offer: null, state: 'handled'
    });
    entries.sort((a, b) => (a.state === 'needs' ? -1 : 0) - (b.state === 'needs' ? -1 : 0));
    return entries;
  }
  function renderChatEntryRow(e, idx) {

      (e.offer != null ? '<span class="side"><span class="offer-pill">€' + e.offer + '</span></span>' : '') +

  function renderProduct() {

    const seg4bars = [0, 1, 2, 3].map(i => '<i class="' + (i <= stageIdx ? 'on' : '') + '"></i>').join('');
    const chatCount = entries.filter(e => e.id !== 'noor' || true).length; // Tom (if arrived) + Mila + Noor
    let nowDoing, showTyping = false;
    if (S.sold) nowDoing = 'Sold for €' + S.soldPrice;
    else if (S.milaTyping) { nowDoing = 'Poof is negotiating with Mila'; showTyping = true; }
    else if (S.milaStage > 0 && !S.milaDealDone) nowDoing = 'Poof is negotiating with Mila';
    else if (S.adLive) nowDoing = 'Poof is watching for offers';
    else nowDoing = 'Getting ready to go live';
    const days = S.daysLive > 0 ? S.daysLive : 3;
    const soldCard = `
      <div class="card pad soldcard" style="margin-top:18px">
        <p class="sec" style="margin:0 0 6px">${S.handoverDone ? 'Sold' : 'Deal done'}</p>
        <p style="margin:0;font-weight:800;font-size:18px">To Mila for €${S.soldPrice}</p>

        </ol>
        <div class="recap divided" style="margin-top:6px">
          <div><span>Time to sell</span><b>${days} day${days === 1 ? '' : 's'}</b></div>
          <div><span>Asked · sold for</span><b>€${S.goal} · €${S.soldPrice}</b></div>
          <div><span>Messages Poof handled</span><b>${messagesHandled()}</b></div>
          <div><span>Buyers talked to</span><b>5</b></div>
        </div>
        ${!S.handoverDone ? '<button class="btn" type="button" data-act="mark-handover-done" style="margin-top:14px">' + handoverDoneLabel() + '</button>' : ''}
        <button class="btn ${S.handoverDone ? '' : 'secondary'}" type="button" data-go="chat-mila" style="margin-top:8px">See the deal with Mila</button>
      </div>`;
    const topCard = S.sold ? soldCard : needsEntry ? `
      <div class="card pad" style="background:var(--lime);box-shadow:none;margin-top:18px">
        <p class="sec" style="margin:0 0 8px">Needs you</p>

      </div>`;
    const chatSection = S.adLive ? `
      <div class="sec" style="margin-top:20px"><span>${S.sold ? 'All chats for this ad' : 'Chats'}</span><button type="button" data-go="chats" data-mode="tab">All chats</button></div>
      ${entries.map((e, i) => renderChatEntryRow(e, i)).join('')}

    return `

  /* ---------- chats ---------- */
  function renderChats() {
    let airpodsGroup = '';
    if (S.adLive) {
      const entries = airpodsChatEntries();
      airpodsGroup = `
        <div class="group">

    return `
      <div class="body2 has-nav" style="padding-top:28px">
