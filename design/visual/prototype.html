  function chatSummary() {
    if (S.sold) return 'Sold for €' + S.soldPrice;
    const n = 2 + (S.tomOfferArrived ? 1 : 0);
    return n + ' chats · best offer €' + (S.tomOfferArrived ? Math.max(tomOffer(), milaDeal()) : milaDeal());
  }

  /* ---------- Mila thread ---------- */
  function milaScript() {
    const o = milaOpen(), c = milaCounter(), d = milaDeal();
    const itemLower = IT().short.replace(/^[A-Z](?=[a-z])/, ch => ch.toLowerCase());
    const mid = Math.max(o + IT().step, Math.min(d - IT().step, Math.round((o + c) / 2 / 5) * 5));
    return [
      { from: 'buyer', text: 'Hi! ' + (IT().plural ? 'Are the ' : 'Is the ') + itemLower + ' still available?' },
      { from: 'poof', text: 'Yes! Pickup in Amsterdam.' },
      { from: 'buyer', text: 'Nice, any damage or does everything still work fine?' },
      { from: 'poof', text: IT().counterLine },
      { from: 'buyer', text: 'Would you take ' + o + '?', offer: o, kind: 'Offer' },
      { from: 'poof', text: "That's a bit low for me, I can do " + c + '.', offer: c, kind: 'Counter' },
      { from: 'buyer', text: 'Could you do ' + mid + '?', offer: mid, kind: 'Offer' },
      { from: 'poof', text: 'I can meet you at ' + d + '.', offer: d, kind: 'Counter' },
      { from: 'buyer', text: d + ' works, I can pick ' + itThem() + ' up Saturday?', offer: d, kind: 'Offer' },
      { from: 'poof', text: 'Deal! Saturday 14:00 works.', offer: d, kind: 'Accepted', accepted: true },
      { from: 'buyer', text: 'Great, see you then!' },
      { from: 'poof', text: "See you Saturday, I'll send the address closer to the time." }
    ];
  }
  function renderChatMila() {
    const script = milaScript();
    const msgs = script.slice(0, S.milaStage).map(m => {
      const cls = m.from === 'buyer' ? 'msg buyer' : 'msg agent-m';
      const who = m.from === 'buyer' ? '<span class="who">Mila</span>' : '<span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>';
      const offerHtml = m.offer != null ? '<div class="offer-card' + (m.accepted ? ' accepted' : '') + '"><small>' + m.kind + '</small><b>€' + m.offer + '</b></div>' : '';
      return '<div class="' + cls + '">' + who + offerHtml + m.text + '</div>';
    }).join('');
    const typing = S.milaTyping ? '<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span></div>' : '';
    const deal = S.milaDealDone ? '<div class="deal"><span class="cal"><small>Sat</small><b>' + nextSaturday() + '</b></span><div><b>Deal at €' + (S.sold ? S.soldPrice : milaDeal()) + '</b><span class="small muted">Pickup Saturday 14:00 · address shared with Mila</span></div></div>' : '';
    const youMsgs = (S.milaYouMsgs || []).map(t => '<div class="msg you"><span class="who">You</span>' + escapeHtml(t) + '</div>').join('');
    return `
      <div class="top2"><button class="icon-btn" type="button" aria-label="Back" data-back>${ic('back')}</button>
        <div class="grow"><h1 class="bar-title" style="font-size:17px">Mila</h1><span class="xs muted">Marktplaats</span></div>
      </div>
      <div class="item-row">${sticker(IT().cutout, -2)}<div class="grow"><b class="small">${IT().title}</b><span>€${S.goal}, never below €${S.min}</span></div></div>
      <div class="body2"><div class="thread"><span class="day">Today</span>${msgs}${typing}${deal}${youMsgs}</div></div>
      <div class="composer">
        <div class="row"><label class="sr" for="milaInput">Your message</label><input id="milaInput" type="text" placeholder="Say something (optional)"><button class="icon-btn" type="button" data-act="mila-send" aria-label="Send">${ic('send')}</button></div>
      </div>`;
  }
  function playMila() {
    const script = milaScript();
    const steps = [];
    script.forEach(() => {
      steps.push(() => { S.milaTyping = true; refreshInPlace('chat-mila'); refreshInPlace('product'); refreshInPlace('home'); });
      steps.push(750);
      steps.push(() => { S.milaTyping = false; S.milaStage++; refreshInPlace('chat-mila'); popLastMessage(); refreshInPlace('product'); refreshInPlace('home'); });
      steps.push(550);
    });
    steps.push(() => { S.milaDealDone = true; refreshInPlace('chat-mila'); refreshInPlace('chats'); refreshInPlace('product'); refreshInPlace('home'); });
    runChain(steps);
  }

  /* ---------- Tom chat ---------- */
  function renderChatTom() {
    const t = tomOffer();
    const decisionMsgs = [];
    decisionMsgs.push('<div class="msg buyer"><span class="who">Tom</span>Would you do ' + t + '? I can come tonight.</div>');
    decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>Tom offered €' + t + ', below your €' + S.min + '. Counter at €' + S.min + '?</div>');
    if (S.tomResolved === 'counter') {
      decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span><div class="offer-card"><small>Counter</small><b>€' + S.min + '</b></div>I can do ' + S.min + '.</div>');
      if (S.sold || S.daysLive > 0) decisionMsgs.push('<div class="msg buyer"><span class="who">Tom</span>Hmm, let me think about it.</div>');
      if (S.sold) decisionMsgs.push('<span class="day">Later</span><div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>Sorry Tom, it just sold. Thanks for your interest!</div>');
    } else if (S.tomResolved === 'accept') {
      decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span><div class="offer-card accepted"><small>Accepted</small><b>€' + t + '</b></div>Deal, thanks!</div>');
    } else if (S.tomResolved === 'decline') {
      decisionMsgs.push('<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>Sorry, can’t go that low. Thanks for the interest!</div>');
    }
    const youMsgs = (S.tomYouMsgs || []).map(txt => '<div class="msg you"><span class="who">You</span>' + escapeHtml(txt) + '</div>').join('');
    const typing = S.tomTyping ? '<div class="msg agent-m"><span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span></div>' : '';
    const chips = (!S.tomResolved && !S.tomTyping) ? `
      <div class="qr" style="animation:qrUp .3s var(--out) backwards">
        <button class="qrbtn primary" type="button" data-act="tom-counter">Counter €${S.min}</button>
        <button class="qrbtn secondary" type="button" data-act="tom-accept">Accept €${t}</button>
        <button class="qrbtn secondary" type="button" data-act="tom-decline">Decline</button>
      </div>` : '';
    return `
      <div class="top2"><button class="icon-btn" type="button" aria-label="Back" data-back>${ic('back')}</button>
        <div class="grow"><h1 class="bar-title" style="font-size:17px">Tom</h1><span class="xs muted">Marktplaats</span></div>
      </div>
      <div class="item-row">${sticker(IT().cutout, 2)}<div class="grow"><b class="small">${IT().title}</b><span>€${S.goal}, never below €${S.min}</span></div></div>
      <div class="body2"><div class="thread"><span class="day">Today</span>${decisionMsgs.join('')}${youMsgs}${typing}</div></div>
      ${chips}
      <div class="composer">
        <div class="row"><label class="sr" for="tomInput">Your message</label><input id="tomInput" type="text" placeholder="Or type your own message"><button class="icon-btn" type="button" data-act="tom-send" aria-label="Send">${ic('send')}</button></div>
      </div>`;
  }

  /* ---------- Noor chat (a question Poof answered on its own) ---------- */
  function renderChatNoor() {
    const poof = '<span class="who"><span class="agenttag">' + cloudmark() + 'POOF</span></span>';
    return `
      <div class="top2"><button class="icon-btn" type="button" aria-label="Back" data-back>${ic('back')}</button>
        <div class="grow"><h1 class="bar-title" style="font-size:17px">Noor</h1><span class="xs muted">Vinted</span></div>
      </div>
      <div class="item-row">${sticker(IT().cutout, 3)}<div class="grow"><b class="small">${IT().title}</b><span>€${S.goal}, never below €${S.min}</span></div></div>

      </div>`;
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function pulsePrices() {
    if (reduceMotion || !currentLayer) return;
    currentLayer.querySelectorAll('.price-big').forEach(el => { el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); });
  }
  function popLastMessage() {
    if (reduceMotion || !currentLayer) return;
    const list = currentLayer.querySelectorAll('.thread .msg');
    const last = list[list.length - 1];
    if (last) last.style.animation = 'msgPop .22s var(--out)';
  }

  /* ---------- sold, deal timing ---------- */
  function startSoldCountdown() {
    if (S.soldTimerStarted || S.sold) return;
    S.soldTimerStarted = true;
    // Mila's negotiation plays out so you can show it live, but the sale itself never lands on its own:
    // use the presenter controls ("Deal now" / "Skip ahead") to decide when it's sold.
    if (!S.milaPlayed) { S.milaPlayed = true; runChain([1200, playMila]); }
  }
  function soldEvent() {
    if (S.sold) return;
    S.sold = true;
    S.soldPrice = milaDeal();
    S.milaStage = milaScript().length;
    S.milaDealDone = true;
    refreshInPlace('chats'); refreshInPlace('chat-mila'); refreshInPlace('product'); refreshInPlace('home');
    updateTabbar(currentId);
    showBanner('Sold for €' + S.soldPrice, () => go('sold', {}, { mode: 'push' }), true);
  }

  /* ---------- demo helper: jump straight to "a few days later, sold" for filming ---------- */
  function skipAheadDays() {
    clearBg();
    stopCamera();
    hideBanner();
    if (!S.photos.length) S.photos = demoPhotos().slice();
    S.created = true;
    S.uploading = false;
    S.platformStatus = { marktplaats: 'live', ebay: 'live', vinted: 'live', facebook: 'live' };
    S.adLive = true;
    S.daysLive = 3;
    S.views = 340; S.saves = 22;
    S.tomOfferArrived = true;
    S.tomResolved = 'counter';
    S.tomYouOffer = S.min;
    S.tomTyping = false;
    S.milaPlayed = true;
    S.milaTyping = false;
    S.milaStage = milaScript().length;
    S.milaDealDone = true;
    S.sold = true;
    S.handoverDone = false; // deal's done, but pickup hasn't happened yet: stays in Selling with its own status
    S.soldRevealed = false; // opening it still plays the full poof reveal, with the cutout
    S.soldPrice = milaDeal();
    S.soldTimerStarted = true;
    refreshInPlace('home'); refreshInPlace('chats'); refreshInPlace('product'); refreshInPlace('chat-mila'); refreshInPlace('chat-tom');
    updateTabbar(currentId);
    S.homeTab = 'selling';
    if (currentId !== 'home') go('home', {}, { mode: 'tab' }); else refreshInPlace('home');
    runChain([1400, () => showBanner('Sold for €' + S.soldPrice + ' · ' + IT().short + ' to Mila', () => go('sold', {}, { mode: 'push' }), true)]);
  }

  /* ---------- sound ---------- */
  const sfxPool = (src, vol) => {
    let pool = null;
    const build = () => Array.from({ length: 2 }, () => { const a = new Audio(src); a.preload = 'auto'; a.volume = vol; return a; });
    let n = 0;
    return () => { try { if (!pool) pool = build(); const a = pool[n++ % pool.length]; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} };
  };
  const sndItem = sfxPool('assets/poof-item.mp3', .5);
  const sndDone = sfxPool('assets/poof-success.mp3', .6);
  function spritePoofIn(container, el, scale) {
    const r = el.getBoundingClientRect(), h = container.getBoundingClientRect();
    const size = Math.max(90, Math.min(260, Math.max(r.width, r.height) * (scale || 1.6)));
    const fx = document.createElement('span');
    fx.className = 'poof-fx';
    Object.assign(fx.style, { width: size + 'px', height: size + 'px', left: (r.left + r.width / 2 - h.left - size / 2) + 'px', top: (r.top + r.height / 2 - h.top - size / 2) + 'px' });
    container.appendChild(fx);
    fx.addEventListener('animationend', () => { setTimeout(() => { fx.classList.add('out'); setTimeout(() => fx.remove(), 400); }, 200); }, { once: true });
  }
  function poofSticker(container, stickerEl, scale, onDone) {
    if (reduceMotion) { stickerEl.style.visibility = 'hidden'; sndDone(); onDone && onDone(); return; }
    stickerEl.animate([
      { transform: 'scale(1,1)', opacity: 1 },
      { transform: 'scale(1.14,.84)', opacity: 1, offset: .45 },
      { transform: 'scale(.86,1.18)', opacity: 1, offset: .75 },
      { transform: 'scale(0,0)', opacity: 0 }
    ], { duration: 300, easing: 'ease-in', fill: 'forwards' });
    setTimeout(() => { sndItem(); spritePoofIn(container, stickerEl, scale); }, 190);
    setTimeout(() => { sndDone(); onDone && onDone(); }, 850);
  }

  function renderSold() {
    const done = S.handoverDone;
    return `
      <div class="soldphone" style="flex:1;display:flex;flex-direction:column">

            </ol>
            ${!done ? '<button class="btn" type="button" data-act="mark-handover-done" style="margin-top:14px">' + handoverDoneLabel() + '</button>' : ''}
            <div class="card recap divided pad" style="box-shadow:var(--shadow-soft);margin-top:10px">
              <div><span>Time to sell</span><b>${S.daysLive > 0 ? S.daysLive : 3} day${(S.daysLive > 0 ? S.daysLive : 3) === 1 ? '' : 's'}</b></div>
              <div><span>Messages handled</span><b>${messagesHandled()}</b></div>
              <div><span>Counter offers</span><b>${S.tomResolved ? 3 : 2}</b></div>
            </div>
            <p class="sec">Conversation with Mila</p>
            <button class="chat-row calm" type="button" data-go="chat-mila" style="margin-top:2px">
              ${chatAvatar('M', 'marktplaats')}
              <span class="grow"><span class="top-line"><b class="normal">Mila</b></span><span class="last">${poofLine(milaScript().slice(-1)[0].text)}</span></span>
              ${ic('right')}
            </button>
            <p class="sec">Removed from</p>
            <div class="rchips" style="margin-top:2px">
              ${PLATFORM_ORDER.map(k => '<span>' + platIcon(k, 20) + ic('check') + PLATFORMS[k].name + '</span>').join('')}
            </div>
            <button class="btn secondary" type="button" data-go="product" data-mode="replace" style="margin-top:18px">See the ad and all chats</button>
            <button class="btn ghost" type="button" data-act="sell-else" style="margin-top:4px">Sell something else</button>
          </div>
        </div>
      </div>`;
  }
  // Revisiting a pending-handover item: show the recap already settled, no replayed animation.
  function showSoldSettled() {
    const layer = currentLayer;
    const text = layer && layer.querySelector('#soldText');
    const panel = layer && layer.querySelector('#soldPanel');
    const stickerEl = layer && layer.querySelector('#soldSticker');
    if (stickerEl) stickerEl.style.visibility = 'hidden';
    if (text) text.classList.add('show');
    if (panel) panel.classList.add('show');
  }
  function playSoldReveal() {
    const layer = currentLayer;
    const stage = layer.querySelector('#soldStage');
    const stickerEl = layer.querySelector('#soldSticker');
    const text = layer.querySelector('#soldText');
    const panel = layer.querySelector('#soldPanel');
    runChain([260, () => {
      poofSticker(stage, stickerEl, 1.8, () => {
        text.classList.add('show');
        runChain([250, () => { panel.classList.add('show'); S.soldRevealed = true; }]);
      });
    }]);
  }

  /* ---------- home ---------- */
  function renderHome() {
    const tile = (img, tilt, title, price, sold, go, idx, status) => {
      const delay = (idx || 0) * 35;
      const statusHtml = status ? '<span class="tile-status">' + statusChip(status.kind, status.label) + '</span>' : '';
      const pending = status && status.kind === 'pending';
      return '<li style="animation:fadeUp .28s var(--out) backwards;animation-delay:' + delay + 'ms"><button class="gtile' + (sold ? ' is-sold' : pending ? ' is-pending' : '') + '" type="button"' + (go ? ' data-go="' + go + '"' : '') + '><span class="stickerwrap">' + sticker(img, tilt) +
      '<span class="pricetag' + (sold ? ' sold' : '') + '" style="--tilt:' + (tilt > 0 ? -4 : 4) + 'deg;animation:tagDrop .4s var(--out) backwards;animation-delay:' + (delay + 150) + 'ms">' + (sold ? 'Sold €' : '€') + price + '</span></span><span class="t">' + title + '</span>' + statusHtml + '</button></li>';
    };
    const items = HOME_ITEMS.map(it => ({ img: it.img, tilt: it.tilt, title: it.title, price: it.price, sold: !!it.sold, status: it.status }));
    if (S.created) items.unshift({ img: IT().cutout, tilt: -3, title: IT().short, price: S.sold ? S.soldPrice : S.goal, sold: !!S.handoverDone, go: pendingHandover() ? 'sold' : 'product', status: airpodsHomeStatus() });
    let selling = items.filter(i => !i.sold);
    const sold = items.filter(i => i.sold);
    selling = selling.slice().sort((a, b) => ((a.status && a.status.kind === 'needs') ? -1 : 0) - ((b.status && b.status.kind === 'needs') ? -1 : 0));
    const showSold = S.homeTab === 'sold';
    const list = (showSold ? sold : selling).map((i, idx) => tile(i.img, i.tilt, i.title, i.price, i.sold, i.go, idx, i.status)).join('');
    const empty = '<p class="muted" style="text-align:center;padding:48px 0">' + (showSold ? 'Nothing sold yet.' : 'Nothing for sale. Tap + to sell something.') + '</p>';
    return `
      <div class="body2 has-nav" style="padding-top:28px">
        <div class="home-head"><h1 id="homeTitle">Your ads</h1></div>
        <div class="homeseg" role="tablist" aria-label="Your ads">
          <button type="button" role="tab" data-act="home-tab" data-v="selling" aria-selected="${!showSold}">Selling <span>${selling.length}</span></button>
          <button type="button" role="tab" data-act="home-tab" data-v="sold" aria-selected="${showSold}">Sold <span>${sold.length}</span></button>
        </div>
        ${list ? '<ul class="grid-ads">' + list + '</ul>' : empty}
      </div>`;
  }

  /* ---------- restart ---------- */
  function restart() {
    clearBg();
    stopCamera();
    S = freshState();
    hideBanner();
    closePresenter();
    stack = [{ id: 'home', params: {} }];
    if (currentLayer) currentLayer.remove();
    currentLayer = null;
    history.replaceState({ d: 1 }, '', '#home');
    render('home', {}, null);
  }
  document.getElementById('restart').addEventListener('click', restart);
  window.__poofRestart = restart;
  window.__poofState = () => S;
  window.__poofGo = go;

  /* ---------- boot ---------- */
  // A reload always starts clean on home (or chats); deeper screens need state that a reload does not have.
  const initialId = location.hash.slice(1) === 'chats' ? 'chats' : 'home';
  stack = [{ id: initialId, params: {} }];
  history.replaceState({ d: 1 }, '', '#' + initialId);
  render(initialId, {}, null);
})();
</script>
</body>
</html>
