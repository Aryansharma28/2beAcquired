<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e4dc"/><stop offset="1" stop-color="#d9d2c6"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a58a"/><stop offset="1" stop-color="#9c8568"/></linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a2b"/><stop offset=".5" stop-color="#a86f38"/><stop offset="1" stop-color="#7a4d22"/></linearGradient>
    <linearGradient id="oakD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e4520"/><stop offset="1" stop-color="#8a5a2b"/></linearGradient>
    <pattern id="rush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#c9a86a"/><rect width="9" height="18" fill="#b8955a"/></pattern>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="560" fill="url(#wall)"/>
  <rect y="560" width="960" height="240" fill="url(#floor)"/>
  <rect y="556" width="960" height="8" fill="#cfc6b8"/>
  <ellipse cx="480" cy="700" rx="230" ry="34" fill="url(#sh)"/>
  <!-- back legs / uprights -->
  <rect x="352" y="120" width="30" height="580" rx="8" fill="url(#oakD)"/>
  <rect x="578" y="120" width="30" height="580" rx="8" fill="url(#oakD)"/>
  <!-- back slats -->
  <rect x="370" y="150" width="220" height="44" rx="10" fill="url(#oak)"/>
  <rect x="370" y="230" width="220" height="30" rx="8" fill="url(#oak)"/>
  <rect x="370" y="296" width="220" height="30" rx="8" fill="url(#oak)"/>
  <!-- seat -->
  <path d="M312 430 L648 430 L680 480 L280 480 Z" fill="url(#rush)" stroke="#7a4d22" stroke-width="10" stroke-linejoin="round"/>
  <rect x="274" y="478" width="412" height="30" rx="8" fill="url(#oak)"/>
  <!-- front legs -->
  <rect x="290" y="500" width="34" height="210" rx="8" fill="url(#oak)"/>
  <rect x="636" y="500" width="34" height="210" rx="8" fill="url(#oak)"/>
  <!-- stretchers -->
  <rect x="318" y="610" width="324" height="16" rx="6" fill="url(#oakD)"/>
  <rect x="380" y="570" width="200" height="12" rx="5" fill="#6e4520" opacity=".8"/>
</svg>
